<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#9e2f22">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../../shared-ui.css">
  <link rel="stylesheet" href="../../shared-shell.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="../../shared-ui.js"></script>
  <title>Akhlak & Kepribadian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap');
    :root { --paper:#f6efe0; --ink:#4d4034; --muted:#7b6a58; --line:rgba(91,73,57,0.15); --accent:#b97650; --success:#74846c; --danger:#a55a52; --warning:#b58439; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .panel { padding: 22px; }
    h1,h2,h3 { margin: 0 0 10px; }
    p { margin: 0; line-height: 1.6; }
    button, input, select { font: inherit; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
    .ctl { padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(255,255,255,0.7); font-weight: 600; color: var(--ink); outline: none; }
    .ctl:focus { border-color: var(--accent); }
    .regu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 16px; }
    .regu-card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,251,243,0.7); }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--line); color: var(--ink); }
    .chip.gender { background: rgba(116,132,108,0.16); color: var(--success); }
    .empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
    .empty-state i { font-size: 32px; opacity: 0.4; }
    #dlg { width: min(820px, 96vw); }
    .dlg-shell { display: flex; flex-direction: column; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .akh-santri { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: rgba(255,251,243,0.7); }
    .akh-santri .nm { font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .akh-santri .nm small { color: var(--muted); font-weight: 600; font-size: 11px; }
    .aspek-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .aspek-row { display: flex; align-items: center; gap: 8px; }
    .aspek-row .lbl { flex: 1; font-size: 13px; font-weight: 600; }
    .aspek-row select { padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(255,255,255,0.85); font-weight: 700; outline: none; min-width: 64px; }
    .aspek-row .ket { font-size: 11px; color: var(--muted); min-width: 84px; text-align: right; }
    .sd-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .sd-notice { display: none; margin-top: 10px; padding: 10px 14px; border-radius: 10px; font-size: 13px; }
    .minimal-list-card.row-male            { background: #ddeeff; border-color: rgba(70,130,180,0.25); }
    .minimal-list-card.row-female          { background: #ffe4f0; border-color: rgba(200,100,140,0.25); }
    .minimal-list-card.row-male-inactive   { background: linear-gradient(135deg, #888 0%, #cce6ff 100%); border-color: rgba(70,130,180,0.25); }
    .minimal-list-card.row-female-inactive { background: linear-gradient(135deg, #888 0%, #ffd6e8 100%); border-color: rgba(200,100,140,0.25); }
    .minimal-list-card.row-male-frozen     { background: linear-gradient(135deg, #d0d0d0 0%, #cce6ff 100%); border-color: rgba(70,130,180,0.25); }
    .minimal-list-card.row-female-frozen   { background: linear-gradient(135deg, #d0d0d0 0%, #ffd6e8 100%); border-color: rgba(200,100,140,0.25); }
    .minimal-list-card.row-nogender-inactive { background: linear-gradient(135deg, #888 0%, rgba(255,248,230,0.96) 100%); }
    .minimal-list-card.row-nogender-frozen   { background: linear-gradient(135deg, #d0d0d0 0%, rgba(255,248,230,0.96) 100%); }
  </style>
</head>
<body>
  <div class="notice-stack" id="noticeStack" popover="manual"></div>
  <main>
    <div class="app-layout">
      <section class="panel nav" id="nav"></section>
      <div class="content-stack">
        <section class="panel">
          <h1 style="font-family:'Playfair Display',serif;font-size:1.9rem;">Akhlak &amp; Kepribadian</h1>
          <p style="color:var(--muted);font-size:14px;">Input nilai akhlak (huruf A/B/C/D) santri per regu per semester. Keterangan otomatis.</p>
          <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;">
            <label>Tahun Ajaran <select id="taSelect" class="ctl" style="min-width:200px;"></select></label>
            <label>Gender <select id="genderFilter" class="ctl" style="min-width:160px;">
              <option value="">Semua</option>
              <option value="Ikhwan">Ikhwan</option>
              <option value="Akhowat">Akhowat</option>
              <option value="Campur">Campur</option>
              <option value="Tidak ada">Tidak ada</option>
            </select></label>
          </div>
        </section>
        <section class="panel">
          <div id="area"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p style="margin-top:8px;">Memuat...</p></div></div>
        </section>
      </div>
    </div>
  </main>

  <dialog id="dlg">
    <div class="dialog-body duplicate-dialog-body ps-dialog-shell dlg-shell">
      <div class="duplicate-dialog-head ps-dialog-header">
        <div>
          <span class="eyebrow" id="dlgEyebrow">Akhlak</span>
          <h3 id="dlgTitle" style="margin:2px 0 0;">&nbsp;</h3>
        </div>
      </div>
      <div id="dlgBody"></div>
      <div id="dlgNotice" class="sd-notice"></div>
      <div class="sd-foot">
        <button id="dlgClose" type="button">Tutup</button>
        <button id="dlgSave" type="button"><i class="fa-solid fa-floppy-disk"></i> Simpan Semua</button>
      </div>
    </div>
  </dialog>

  <script src="../../shared-access.js"></script>
  <script src="../../shared-nav.js"></script>
  <script src="../../shared-shell.js"></script>
  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = { apiBase: 'ps_api_base', token: 'ps_token', session: 'ps_session' };
    localStorage.setItem(STORAGE.apiBase, API_BASE);
    const state = { tahunAjaranId: '', tahunAjaranList: [], reguList: [], activeRegu: null, aspek: [], grades: [], gradeKet: {}, genderFilter: '' };
    let noticeId = '', noticeCounter = 0;

    function getToken() { return localStorage.getItem(STORAGE.token) || ''; }
    function clearSession() { localStorage.removeItem(STORAGE.token); localStorage.removeItem(STORAGE.session); }
    function getStoredSession() { try { return JSON.parse(localStorage.getItem(STORAGE.session) || 'null'); } catch (e) { return null; } }
    function canManageAkhlakScoped() {
      const session = window.PSAccess && typeof window.PSAccess.getScopedSession === 'function' ? window.PSAccess.getScopedSession(getStoredSession()) : getStoredSession();
      const p = session && session.permissions;
      return !!(p && (p.isAdmin || p.isSuperAdmin || p.isKsantrian || p.isPembinaRegu));
    }
    function toParams(d) { const p = new URLSearchParams(); Object.entries(d).forEach(([k, v]) => { if (v === undefined || v === null) return; p.append(k, typeof v === 'object' ? JSON.stringify(v) : String(v)); }); return p; }
    function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function showNotice(text, type) {
      const stack = document.getElementById('noticeStack');
      const el = document.createElement('div'); el.className = `notice show ${type || ''}`.trim();
      el.dataset.noticeId = `n-${Date.now()}-${noticeCounter += 1}`; el.textContent = text;
      el.addEventListener('click', () => el.remove()); setTimeout(() => el.remove(), type === 'error' ? 9000 : 5000);
      if (noticeId) { const o = document.querySelector(`[data-notice-id="${noticeId}"]`); if (o) o.remove(); }
      stack.prepend(el); noticeId = el.dataset.noticeId; if (stack.matches(':popover-open')) stack.hidePopover(); stack.showPopover();
    }
    async function api(action, payload = {}, method = 'GET') {
      const token = getToken();
      if (!token) { clearSession(); window.location.replace('/pages/login/'); throw new Error('Sesi tidak ditemukan.'); }
      const scopeLabel = window.PSAccess ? (window.PSAccess.getActiveRoleScopeLabel(getStoredSession()) || '') : '';
      const response = method === 'GET'
        ? await fetch(`${API_BASE}?${toParams({ action, token, scopeLabel, ...payload }).toString()}`)
        : await fetch(API_BASE, { method, body: toParams({ action, token, scopeLabel, ...payload }) });
      const json = await response.json();
      if (!json.ok) { const e = new Error(json.error?.message ? `Server: ${json.error.message}` : 'Gagal.'); e.code = json.error?.code || 500; if (e.code === 401) { clearSession(); window.location.replace('/pages/login/'); } throw e; }
      return json.data;
    }
    function mountShell(session) { return window.PSShell.mount({ currentPage: window.PSAccess ? window.PSAccess.cleanFileName(window.location.pathname) : 'akhlakKepribadian.html', session, getStoredSession, storageKey: STORAGE.session }); }
    function dlgNotice(msg, type) { const el = document.getElementById('dlgNotice'); if (!msg) { el.style.display = 'none'; return; } el.style.display = 'block'; el.style.background = type === 'error' ? 'rgba(165,90,82,0.12)' : 'rgba(116,132,108,0.15)'; el.style.color = type === 'error' ? 'var(--danger)' : 'var(--success)'; el.textContent = msg; }

    function normalizeGender(g) {
      const v = (g || '').trim().toLowerCase();
      if (['l','lk','laki-laki','laki','pria','male'].includes(v)) return 'male';
      if (['p','pr','perempuan','wanita','female'].includes(v)) return 'female';
      return '';
    }
    function normalizeStatus(s) {
      const v = (s || '').trim().toLowerCase();
      if (['inactive','nonaktif'].includes(v)) return 'inactive';
      if (['dibekukan','frozen','beku'].includes(v)) return 'dibekukan';
      return 'active';
    }
    function getCardRowClass(gender, statusKey) {
      if (statusKey === 'inactive') {
        if (gender === 'male') return 'row-male-inactive';
        if (gender === 'female') return 'row-female-inactive';
        return 'row-nogender-inactive';
      }
      if (statusKey === 'dibekukan') {
        if (gender === 'male') return 'row-male-frozen';
        if (gender === 'female') return 'row-female-frozen';
        return 'row-nogender-frozen';
      }
      if (gender === 'male') return 'row-male';
      if (gender === 'female') return 'row-female';
      return '';
    }

    async function loadRegu() {
      const area = document.getElementById('area');
      area.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i></div>';
      try {
        const data = await api('akhlak.reguList');
        state.reguList = data.reguList || [];
        state.aspek = data.aspek || []; state.grades = data.grades || []; state.gradeKet = data.gradeKet || {};
        renderRegu();
      } catch (e) { area.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger)"></i><p style="margin-top:8px;color:var(--danger);font-weight:600;">${escapeHtml(e.message)}</p></div>`; }
    }
    function renderRegu() {
      const area = document.getElementById('area');
      if (!state.reguList.length) { area.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users-slash"></i><p style="margin-top:8px;font-weight:600;">Tidak ada regu yang bisa Anda akses.</p></div>'; return; }
      const filtered = state.genderFilter ? state.reguList.filter(r => r.genderGroup === state.genderFilter) : state.reguList;
      if (!filtered.length) { area.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users-slash"></i><p style="margin-top:8px;font-weight:600;">Tidak ada regu yang cocok dengan filter gender.</p></div>'; return; }
      area.innerHTML = '<div class="regu-grid">' + filtered.map(r => `
        <div class="regu-card">
          <h3>${escapeHtml(r.name)}</h3>
          <div class="meta">
            ${r.genderGroup ? `<span class="chip gender">${escapeHtml(r.genderGroup)}</span>` : ''}
            <span class="chip"><i class="fa-solid fa-users"></i> ${r.santriCount} santri</span>
          </div>
          ${r.pembinaNames && r.pembinaNames.length ? `<p style="font-size:12px;color:var(--muted)">Pembina: ${escapeHtml(r.pembinaNames.join(', '))}</p>` : ''}
          <button onclick="openRegu('${escapeHtml(r.id)}')"><i class="fa-solid fa-star-half-stroke"></i> Input Nilai</button>
        </div>`).join('') + '</div>';
    }

    async function openRegu(reguId) {
      const regu = state.reguList.find(r => r.id === reguId);
      if (!regu) return;
      state.activeRegu = regu;
      document.getElementById('dlgTitle').textContent = regu.name;
      document.getElementById('dlgEyebrow').textContent = 'Akhlak & Kepribadian';
      dlgNotice('');
      document.getElementById('dlgBody').innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i></div>';
      document.getElementById('dlg').showModal();
      try {
        const data = await api('akhlak.santriList', { reguId, tahunAjaranId: state.tahunAjaranId });
        renderSantri(data.santriList || []);
      } catch (e) { dlgNotice(e.message, 'error'); }
    }
    function gradeOptions(sel) {
      return '<option value="">—</option>' + state.grades.map(g => `<option value="${g}" ${g === sel ? 'selected' : ''}>${g}</option>`).join('');
    }
    function renderSantri(list) {
      const body = document.getElementById('dlgBody');
      if (!list.length) { body.innerHTML = '<div class="empty-state"><i class="fa-solid fa-user-slash"></i><p style="margin-top:6px;">Tidak ada santri.</p></div>'; return; }
      body.innerHTML = list.map(s => `
        <div class="akh-santri" data-santri-id="${escapeHtml(s.id)}">
          <div class="nm"><span>${escapeHtml(s.name)} <small>${escapeHtml(s.noInduk || '')}</small></span></div>
          <div class="aspek-grid">
            ${state.aspek.map(a => {
              const v = (s.nilai && s.nilai[a.key]) || '';
              return `<div class="aspek-row" data-aspek="${escapeHtml(a.key)}">
                <span class="lbl">${escapeHtml(a.label)}</span>
                <select onchange="updateKet(this)">${gradeOptions(v)}</select>
                <span class="ket">${escapeHtml(v ? (state.gradeKet[v] || '') : '')}</span>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('');
    }
    function updateKet(selectEl) {
      const ket = selectEl.parentElement.querySelector('.ket');
      ket.textContent = selectEl.value ? (state.gradeKet[selectEl.value] || '') : '';
    }

    async function saveAll() {
      if (!canManageAkhlakScoped()) { dlgNotice('Mudir hanya bisa melihat data akhlak, tidak bisa menyimpan perubahan.', 'error'); return; }
      const cards = Array.from(document.querySelectorAll('.akh-santri'));
      if (!cards.length) return;
      const btn = document.getElementById('dlgSave'); btn.disabled = true;
      dlgNotice('Menyimpan...', 'success');
      let saved = 0, failed = 0;
      for (const card of cards) {
        const santriId = card.getAttribute('data-santri-id');
        const nilai = {};
        card.querySelectorAll('.aspek-row').forEach(row => { const v = row.querySelector('select').value; if (v) nilai[row.getAttribute('data-aspek')] = v; });
        try { await api('akhlak.save', { santriId, reguId: state.activeRegu.id, tahunAjaranId: state.tahunAjaranId, nilai }, 'POST'); saved++; }
        catch (e) { failed++; }
      }
      btn.disabled = false;
      dlgNotice(failed ? `${saved} tersimpan, ${failed} gagal.` : `Nilai ${saved} santri tersimpan.`, failed ? 'error' : 'success');
    }

    function renderTa() {
      const sel = document.getElementById('taSelect');
      sel.innerHTML = state.tahunAjaranList.map(t => `<option value="${escapeHtml(t.id)}" ${t.id === state.tahunAjaranId ? 'selected' : ''}>${escapeHtml(t.namaDisplay || t.nama)}${t.isAktif ? ' (Aktif)' : ''}</option>`).join('') || '<option value="">-- belum ada --</option>';
    }
    async function loadTa() {
      // ambil daftar TA dari endpoint akhlak.santriList butuh regu; pakai tahunAjaran.list umum
      try {
        const data = await api('tahunAjaran.list');
        const items = (data.items || []).slice().sort((a, b) => (a.isAktif === b.isAktif) ? 0 : (a.isAktif ? -1 : 1));
        state.tahunAjaranList = items.map(t => ({ id: t.id, nama: t.nama, namaDisplay: t.namaDisplay || (t.semester ? t.nama + ' - ' + t.semester : t.nama), isAktif: t.isAktif }));
        const aktif = state.tahunAjaranList.find(t => t.isAktif) || state.tahunAjaranList[0];
        state.tahunAjaranId = aktif ? aktif.id : '';
        renderTa();
      } catch (e) { /* ignore, regu list still works with default TA */ }
    }

    window.openRegu = openRegu; window.updateKet = updateKet;

    const session = getStoredSession();
    if (!session) { clearSession(); window.location.replace('/pages/login/'); }
    else if (window.PSAccess && window.PSAccess.redirectIfForbidden(session, '/pages/akhlakKepribadian/')) { /* redirected */ }
    else {
      mountShell(session);
      document.getElementById('taSelect').addEventListener('change', function () { state.tahunAjaranId = this.value; });
      document.getElementById('genderFilter').addEventListener('change', function () { state.genderFilter = this.value; renderRegu(); });
      document.getElementById('dlgClose').addEventListener('click', () => document.getElementById('dlg').close());
      document.getElementById('dlgSave').addEventListener('click', saveAll);
      document.getElementById('dlg').addEventListener('cancel', (e) => { e.preventDefault(); document.getElementById('dlg').close(); });
      window.addEventListener('load', async () => { await loadTa(); await loadRegu(); });
    }
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {}); }
  </script>
</body>
</html>
