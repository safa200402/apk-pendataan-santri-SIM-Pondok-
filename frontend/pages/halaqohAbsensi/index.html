        (slotRecord && Array.isArray(slotRecord.entries) ? slotRecord.entries : []).forEach(entry => {
          entryMapsBySlot[slotKey][entry.santriId] = entry;
        });
      });

      target.innerHTML = `
        <div class="attendance-matrix-wrap">
          <table class="attendance-matrix">
            <thead>
              <tr>
                <th class="sticky-col">
                  <div class="matrix-name-head">
                    <strong style="color: white;text-align: center;">Nama Santri</strong>
                  </div>
                </th>
                ${state.modal.windowDates.map(slotKey => {
                  const { date, sesi } = parseSlotKey(slotKey);
                  const slotRecord = getModalRecordByDate(slotKey);
                  const summary = slotRecord && slotRecord.summary ? `${slotRecord.summary.filled}/${slotRecord.summary.total}` : '0/0';
                  return `
                    <th>
                      <div class="matrix-day-btn ${slotKey === state.modal.selectedDate ? 'selected' : ''}" data-select-date="${escapeHtml(slotKey)}" data-day-cell="true" role="button" tabindex="0">
                        <span>${escapeHtml(formatWeekdayFull(date))}</span>
                        <strong>${escapeHtml(formatDayMonth(date))}</strong>
                        <small>Sesi ${sesi} · ${escapeHtml(summary)} isi</small>
                      </div>
                    </th>
                  `;
                }).join('')}
              </tr>
            </thead>
            <tbody>
              ${entries.map(entry => `
                <tr>
                  <th class="sticky-col">
                    <div class="matrix-name-cell" data-select-date="${escapeHtml(state.modal.selectedDate)}" role="button" tabindex="0">
                      <div class="santri-identity">
                        <strong class="santri-name">${escapeHtml(entry.santriName || '-')}</strong>
                        <span class="santri-meta">${entry.noInduk ? `No. Induk ${escapeHtml(entry.noInduk)}` : 'No. Induk belum diisi'}</span>
                        ${entry.removedFromHalaqoh ? `<span class="santri-removed-tag" title="Santri ini sudah dikeluarkan dari halaqoh, riwayat absensinya tetap ditampilkan dan bisa diedit.">Dikeluarkan dari halaqoh</span>` : ''}
                      </div>
                    </div>
                  </th>
                  ${state.modal.windowDates.map(slotKey => {
                    const { date, sesi } = parseSlotKey(slotKey);
                    const slotEntry = entryMapsBySlot[slotKey][entry.santriId] || {};
                    const status = slotEntry.status || '';
                    const locked = slotEntry.editable === false;
                    const notYetMember = locked && !!slotEntry.notYetMember;
                    const conditions = matrixConditionInfos(slotEntry, date);
                    const label = notYetMember
                      ? `${entry.santriName || 'Santri'} belum jadi anggota halaqoh ini pada ${formatLongDate(date)} Sesi ${sesi}.`
                      : locked
                      ? `${entry.santriName || 'Santri'} sudah dikeluarkan dari halaqoh ini dan tidak punya riwayat absensi pada ${formatLongDate(date)} Sesi ${sesi}.`
                      : conditions.length
                      ? `${entry.santriName || 'Santri'} ${getStatusLabel(status)} pada ${formatLongDate(date)} Sesi ${sesi} — ${conditions.map(c => c.text).join(' · ')}`
                      : `${entry.santriName || 'Santri'} ${getStatusLabel(status)} pada ${formatLongDate(date)} Sesi ${sesi}`;
                    return `
                      <td>
                        <div
                          class="matrix-cell ${slotKey === state.modal.selectedDate ? 'is-selected-date' : ''} ${locked ? 'is-locked-cell' : ''}"
                          data-matrix-cell="true"
                          data-date="${escapeHtml(slotKey)}"
                          data-santri-id="${escapeHtml(entry.santriId)}"
                          data-status-value="${escapeHtml(status)}"
                          title="${escapeHtml(label)}"
                          aria-label="${escapeHtml(label)}"
                          role="button"
                          tabindex="0"
                        >
                          <strong>${escapeHtml(locked ? '—' : getStatusShort(status))}</strong>
                          <span>${escapeHtml(notYetMember ? 'Belum jadi anggota' : locked ? 'Tidak diabsen' : getStatusLabel(status))}</span>
                          ${conditions.length ? `<span class="matrix-cell-condition-wrap" aria-hidden="true">${conditions.map(c => `<span class="matrix-cell-condition matrix-cell-condition-${c.type}">${escapeHtml(c.label)}</span>`).join('')}</span>` : ''}
                        </div>
                      </td>
                    `;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      const hint = document.getElementById('matrixLongPressHint');
      if (hint) {
        hint.hidden = false;
        clearTimeout(window._matrixHintTimer);
        window._matrixHintTimer = window.setTimeout(function() { hint.hidden = true; }, 5000);
      }
    }

    function renderEditorMeta() {
      const halaqoh = state.modal.halaqoh;
      const record = state.modal.record;
      const hasEntries = !!(record && Array.isArray(record.entries) && record.entries.length);
      document.getElementById('dialogTitle').textContent = halaqoh ? halaqoh.name : 'Memuat halaqoh...';
      document.getElementById('attendanceDate').value = state.modal.windowEndDate || state.today;
      const windowSizeSelect = document.getElementById('attendanceWindowSize');
      if (windowSizeSelect) windowSizeSelect.value = String(state.modal.windowSize || 10);
      document.getElementById('setAllHadirButton').textContent = getBulkCycleButtonLabel();
      document.getElementById('setAllHadirButton').disabled = !hasEntries;
      document.getElementById('clearAllButton').disabled = !hasEntries;
      document.getElementById('copyLatestButton').disabled = !halaqoh || !(halaqoh.recentRecords || []).length;
      document.getElementById('undoButton').disabled = !state.modal.undoStack.length;
      document.getElementById('redoButton').disabled = !state.modal.redoStack.length;
      syncDirtyPill();
    }

    function renderDialog() {
      renderEditorMeta();
      renderAttendanceBody();
    }

    function markModalDirty(nextDirty) {
      state.modal.dirty = !!nextDirty;
      syncDirtyPill();
    }

    async function openAttendanceModal(halaqohId, options = {}) {
      if (state.modal.open && !options.skipConfirm && !(await confirmSavePendingChanges())) {
        return;
      }

      const dialog = document.getElementById('attendanceDialog');
      if (!dialog.open) {
        dialog.showModal();
      }

      state.modal.open = true;
      state.modal.loading = true;
      state.modal.filter = '';
      markModalDirty(false);
      state.modal.halaqoh = getCardById(halaqohId);
      state.modal.record = null;
      state.modal.selectedDate = options.selectedDate || '';
      state.modal.windowEndDate = options.date || '';
      state.modal.windowDates = [];
      state.modal.recordsByDate = {};
      state.modal.originalRecordsByDate = {};
      state.modal.dirtyDates = [];
      state.modal.bulkSetIndex = 0;
      state.modal.undoStack = [];
      state.modal.redoStack = [];
      document.getElementById('santriSearchInput').value = '';
      renderDialog();

      const requestToken = state.modal.requestToken + 1;
      state.modal.requestToken = requestToken;

      try {
        const data = await api('halaqoh.absensi.get', {
          halaqohId,
          tanggal: options.date || '',
          recordId: options.recordId || '',
          windowSize: normalizeWindowSize(options.windowSize || state.modal.windowSize)
        });
        if (state.modal.requestToken !== requestToken) return;

        state.modal.halaqoh = data.halaqoh || getCardById(halaqohId);
        applyModalWindow(data, options);
        state.modal.loading = false;
        renderDialog();
        requestAnimationFrame(() => {
          const body = document.getElementById('attendanceBody');
          if (body) body.scrollLeft = options.scrollTo === 'start' ? 0 : body.scrollWidth;
        });
      } catch (error) {
        if (state.modal.requestToken !== requestToken) return;
        state.modal.loading = false;
        renderDialog();
        showNotice(error.message || 'Gagal membuka editor absensi halaqoh.', 'error');
      }
    }

    async function closeAttendanceDialog(force) {
      const dialog = document.getElementById('attendanceDialog');
      if (!dialog.open) return;
      if (!force && !(await confirmSavePendingChanges())) return;
      dialog.close();
      resetModalState();
    }

    function getModalEntry(dateValue, santriId) {
      const record = getModalRecordByDate(dateValue);
      if (!record || !Array.isArray(record.entries)) return null;
      return record.entries.find(entry => entry.santriId === santriId) || null;
    }

    function selectModalDate(dateValue) {
      if (!dateValue || !getModalRecordByDate(dateValue)) return;
      state.modal.selectedDate = dateValue;
      syncSelectedModalRecord();
      renderDialog();
    }

    function setCellStatus(dateValue, santriId, status, options = {}) {
      const lockedEntry = getModalEntry(dateValue, santriId);
      if (lockedEntry && lockedEntry.editable === false) {
        if (state.modal.selectedDate !== dateValue) {
          state.modal.selectedDate = dateValue;
          syncSelectedModalRecord();
          renderDialog();
        }
        showNotice(lockedEntry.notYetMember
          ? `${lockedEntry.santriName || 'Santri'} belum jadi anggota halaqoh ini pada tanggal ini.`
          : `${lockedEntry.santriName || 'Santri'} sudah dikeluarkan dari halaqoh ini dan belum punya riwayat absensi pada tanggal ini.`, 'info');
        return;
      }
      commitModalMutation(() => {
        const entry = getModalEntry(dateValue, santriId);
        if (!entry) return false;
        const nextStatus = options.toggle && status && entry.status === status ? '' : (status || '');
        const selectedChanged = state.modal.selectedDate !== dateValue;
        state.modal.selectedDate = dateValue;
        syncSelectedModalRecord();
        if ((entry.status || '') === nextStatus) {
          return { changed: selectedChanged };
        }
        entry.status = nextStatus;
        recalculateRecordSummary(getModalRecordByDate(dateValue));
        return { changed: true };
      });
    }

    function applyCellStatus(dateValue, santriId, status) {
      setCellStatus(dateValue, santriId, status, { toggle: true });
    }

    function cycleCellStatus(dateValue, santriId) {
      const entry = getModalEntry(dateValue, santriId);
      if (!entry) return;
      setCellStatus(dateValue, santriId, getNextCycleStatus(entry.status || ''), { toggle: false });
    }

    function setColumnStatus(dateValue, status) {
      commitModalMutation(() => {
        const record = getModalRecordByDate(dateValue);
        if (!record || !Array.isArray(record.entries)) return false;
        const nextStatus = status || '';
        const selectedChanged = state.modal.selectedDate !== dateValue;
        let changed = false;
        state.modal.selectedDate = dateValue;
        syncSelectedModalRecord();
        record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(record);
        }
        const { date, sesi } = parseSlotKey(dateValue);
        return {
          changed: changed || selectedChanged,
          noticeText: changed ? `Kolom ${formatDayMonth(date)} sesi ${sesi} diset ${getStatusLabel(nextStatus).toLowerCase()}.` : ''
        };
      });
    }

    function clearLongPressTimer() {
      if (state.modal.longPressTimer) {
        window.clearTimeout(state.modal.longPressTimer);
      }
      state.modal.longPressTimer = null;
    }

    function getLongPressDateFromEvent(event) {
      const cell = event.target.closest('[data-matrix-cell]');
      if (cell) return cell.getAttribute('data-date') || '';
      const dayButton = event.target.closest('[data-day-cell]');
      return dayButton ? (dayButton.getAttribute('data-select-date') || '') : '';
    }

    function startColumnLongPress(event) {
      const dateValue = getLongPressDateFromEvent(event);
      if (!dateValue) return;
      clearLongPressTimer();
      state.modal.longPressHandled = false;
      const targetButton = event.target.closest('button');
      if (targetButton) targetButton.classList.add('is-long-pressing');
      state.modal.longPressTimer = window.setTimeout(() => {
        state.modal.longPressTimer = null;
        state.modal.longPressHandled = true;
        if (targetButton) targetButton.classList.remove('is-long-pressing');
        setColumnStatus(dateValue, 'hadir');
      }, 650);
    }

    function stopColumnLongPress(event) {
      const targetButton = event && event.target ? event.target.closest('button') : null;
      if (targetButton) targetButton.classList.remove('is-long-pressing');
      clearLongPressTimer();
    }

    function setAllStatuses(status) {
      commitModalMutation(() => {
        if (!state.modal.record || !Array.isArray(state.modal.record.entries)) return false;
        const nextStatus = status || '';
        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(state.modal.record);
        }
        return { changed };
      });
    }

    function clearAllStatuses() {
      setAllStatuses('');
    }

    function cycleSetAllStatuses() {
      const previousIndex = normalizeBulkSetIndex(state.modal.bulkSetIndex);
      const targetStatus = getBulkCycleStatus(previousIndex);
      const nextIndex = normalizeBulkSetIndex(previousIndex + 1);
      commitModalMutation(() => {
        if (!state.modal.record || !Array.isArray(state.modal.record.entries)) return false;
        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === targetStatus) {
            return;
          }
          entry.status = targetStatus;
          changed = true;
        });
        state.modal.bulkSetIndex = nextIndex;
        recalculateRecordSummary(state.modal.record);
        return { changed: changed || nextIndex !== previousIndex };
      });
    }

    function copyStatusesIntoSelectedRecord(sourceRecord, sourceDate) {
      if (!state.modal.record || !sourceRecord || !Array.isArray(sourceRecord.entries)) return;
      const copied = commitModalMutation(() => {
        const sourceMap = {};
        sourceRecord.entries.forEach(entry => {
          sourceMap[entry.santriId] = entry.status || '';
        });

        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          const nextStatus = sourceMap[entry.santriId] || '';
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(state.modal.record);
        }
        return {
          changed,
          noticeText: changed ? `Status dari ${formatShortDate(sourceDate)} berhasil disalin.` : ''
        };
      });

      if (copied) return;
      const sourceMap = {};
      sourceRecord.entries.forEach(entry => {
        sourceMap[entry.santriId] = entry.status || '';
      });
      const alreadySame = state.modal.record && Array.isArray(state.modal.record.entries) && state.modal.record.entries.every(entry => {
        return (entry.status || '') === (sourceMap[entry.santriId] || '');
      });
      if (alreadySame) {
        showNotice(`Status dari ${formatShortDate(sourceDate)} sudah sama.`);
      }
    }

    async function copyLatestStatuses() {
      const halaqoh = state.modal.halaqoh;
      const record = state.modal.record;
      if (!halaqoh || !record) return;

      const currentDate = record.tanggal;
      const localSourceSlot = state.modal.windowDates.slice().reverse().find(slotKey => {
        if (slotKeyToDate(slotKey) === currentDate) return false;
        const slotRecord = getModalRecordByDate(slotKey);
        return !!(slotRecord && slotRecord.exists);
      });
      if (localSourceSlot) {
        const { date: srcDate } = parseSlotKey(localSourceSlot);
        copyStatusesIntoSelectedRecord(getModalRecordByDate(localSourceSlot), srcDate);
        return;
      }

      const source = (halaqoh.recentRecords || []).find(item => item.tanggal !== currentDate) || halaqoh.recentRecords[0];
      if (!source) {
        showNotice('Belum ada riwayat yang bisa disalin untuk halaqoh ini.', 'error');
        return;
      }

      try {
        const data = await api('halaqoh.absensi.get', { halaqohId: halaqoh.id, recordId: source.id });
        copyStatusesIntoSelectedRecord(data.record, source.tanggal);
      } catch (error) {
        showNotice(error.message || 'Gagal menyalin status terakhir.', 'error');
      }
    }

    async function changeModalDate(nextDate, options = {}) {
      if (!state.modal.halaqoh) return;
      if (!nextDate) return;
      await openAttendanceModal(state.modal.halaqoh.id, { date: nextDate, windowSize: state.modal.windowSize, scrollTo: options.scrollTo });
    }

    async function changeModalWindowSize(nextSize) {
      if (!state.modal.halaqoh) return;
      const normalizedSize = normalizeWindowSize(nextSize);
      if (state.modal.dirty && !(await confirmSavePendingChanges())) {
        const sel = document.getElementById('attendanceWindowSize');
        if (sel) sel.value = String(state.modal.windowSize || 10);
        return;
      }
      await openAttendanceModal(state.modal.halaqoh.id, {
        date: state.modal.windowEndDate || state.today,
        selectedDate: state.modal.selectedDate,
        windowSize: normalizedSize,
        skipConfirm: true
      });
    }

    function shiftDate(days) {
      const input = document.getElementById('attendanceDate');
      const current = input.value || state.modal.windowEndDate || state.today;
      if (!current) return;
      changeModalDate(shiftDateValue(current, days), { scrollTo: days < 0 ? 'start' : 'end' });
    }

    async function saveModalChanges(options = {}) {
      if (!state.modal.halaqoh || !state.modal.windowDates.length) return false;
      if (!canManageAbsensiScoped()) { showNotice('Mudir hanya bisa melihat absensi halaqoh, tidak bisa menyimpan perubahan.', 'error'); return false; }
      if (!state.modal.dirtyDates.length) {
        if (!options.silentNoChanges) showNotice('Belum ada perubahan yang perlu disimpan.');
        return true;
      }

      const dirtySlots = state.modal.dirtyDates.slice();

      try {
        for (const slotKey of dirtySlots) {
          const { date, sesi } = parseSlotKey(slotKey);
          const record = getModalRecordByDate(slotKey);
          if (!record) continue;
          await api('halaqoh.absensi.save', {
            record: {
              id: record.id || '',
              tanggal: date,
              sesi: String(sesi),
              halaqohId: state.modal.halaqoh.id,
              catatan: record.catatan || '',
              entries: record.entries.map(entry => ({
                id_santri: entry.santriId,
                status: entry.status || '',
                keterangan: entry.keterangan || ''
              }))
            }
          }, 'POST');
        }
        await loadDashboardData(false);
        if (options.reload !== false) {
          await openAttendanceModal(state.modal.halaqoh.id, {
            date: state.modal.windowEndDate || state.today,
            selectedDate: state.modal.selectedDate,
            windowSize: state.modal.windowSize,
            skipConfirm: true
          });
        } else {
          dirtySlots.forEach(slotKey => {
            const record = getModalRecordByDate(slotKey);
            if (record) state.modal.originalRecordsByDate[slotKey] = clonePlain(record);
          });
          state.modal.dirtyDates = [];
          markModalDirty(false);
        }
        showNotice(dirtySlots.length === 1
          ? `Absensi halaqoh berhasil disimpan untuk sesi ${parseSlotKey(dirtySlots[0]).sesi}.`
          : `Absensi halaqoh berhasil disimpan untuk ${dirtySlots.length} sesi.`);
        return true;
      } catch (error) {
        const message = `${error.message || 'Gagal menyimpan absensi halaqoh.'}${dirtySlots.length > 1 ? ' Sebagian sesi mungkin sudah tersimpan.' : ''}`;
        showNotice(message, 'error');
        return false;
      }
    }

    async function saveModal(event) {
      event.preventDefault();
      const btn = event.submitter;
      if (btn) btn.disabled = true;
      try {
        await saveModalChanges({ reload: true });
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', PSUI.debounce(event => {
        state.searchQuery = event.target.value || '';
        state.page = 1;
        renderCards();
      }, PSUI.AUTOSAVE_DEBOUNCE_MS));
      document.getElementById('filterTa').addEventListener('change', event => {
        state.filterTa = event.target.value || '';
        state.page = 1;
        renderCards();
      });
      document.getElementById('filterGender').addEventListener('change', event => {
        state.filterGender = event.target.value || '';
        state.page = 1;
        renderCards();
      });

      function handlePaginationClick(e) {
        const btn = e.target.closest('[data-page]');
        if (!btn) return;
        const pg = parseInt(btn.dataset.page, 10);
        if (!isNaN(pg)) { state.page = pg; renderCards(); document.querySelector('.content-stack')?.scrollTo({ top: 0, behavior: 'smooth' }); }
      }
      document.getElementById('paginationTop').addEventListener('click', handlePaginationClick);
      document.getElementById('paginationBottom').addEventListener('click', handlePaginationClick);

      document.getElementById('refreshButton').addEventListener('click', async () => {
        try {
          await loadDashboardData(true);
        } catch (error) {
          showNotice(error.message || 'Gagal memuat ulang data.', 'error');
        }
      });

      const rekamJejakButton = document.getElementById('inputRekamJejakButton');
      const pembinaReguOption = findPembinaReguScopeOption(state.session);
      if (pembinaReguOption) {
        rekamJejakButton.disabled = false;
        rekamJejakButton.title = '';
        rekamJejakButton.textContent = 'Input Rekam Jejak';
        rekamJejakButton.addEventListener('click', () => {
          if (window.PSAccess && typeof window.PSAccess.setRoleScope === 'function') {
            window.PSAccess.setRoleScope(state.session, pembinaReguOption.label);
          }
          window.location.href = '../perkembanganSantri/';
        });
      } else {
        const notPembinaMsg = 'Kamu bukan Pembina Regu dan tidak bisa mengisi RJ';
        rekamJejakButton.disabled = true;
        rekamJejakButton.title = notPembinaMsg;
        rekamJejakButton.textContent = notPembinaMsg;
      }

      document.getElementById('halaqohList').addEventListener('click', event => {
        const trigger = event.target.closest('[data-open-halaqoh]');
        if (!trigger) return;
        openAttendanceModal(trigger.getAttribute('data-open-halaqoh'), {
          recordId: trigger.getAttribute('data-record-id') || '',
          date: trigger.getAttribute('data-date') || state.today
        });
      });

      // Safety net: 'close' native event selalu fires apa pun cara dialog ditutup
      // (dialog.close(), Esc, form method="dialog") -- pastikan notice balik ke <body>.
      document.getElementById('attendanceDialog').addEventListener('close', () => {
        relocateNoticeStack();
      });

      document.getElementById('attendanceDialog').addEventListener('cancel', async event => {
        if (state.modal.dirty) {
          event.preventDefault();
          if (await confirmSavePendingChanges()) {
            document.getElementById('attendanceDialog').close();
            resetModalState();
          }
        } else {
          resetModalState();
        }
      });

      document.getElementById('attendanceDialog').addEventListener('click', async event => {
        if (!event.target.closest || !event.target.closest('.ps-dialog-close-floating')) return;
        event.preventDefault();
        event.stopPropagation();
        await closeAttendanceDialog(false);
      }, true);
      document.getElementById('cancelDialogButton').addEventListener('click', () => {
        closeAttendanceDialog(false);
      });
      document.getElementById('attendanceForm').addEventListener('submit', saveModal);

      document.getElementById('attendanceDate').addEventListener('change', event => {
        changeModalDate(event.target.value);
      });
      document.getElementById('prevDateButton').addEventListener('click', () => shiftDate(-1));
      document.getElementById('nextDateButton').addEventListener('click', () => shiftDate(1));
      document.getElementById('attendanceWindowSize').addEventListener('change', event => {
        changeModalWindowSize(event.target.value);
      });
      document.getElementById('santriSearchInput').addEventListener('input', PSUI.debounce(event => {
        state.modal.filter = event.target.value || '';
        renderAttendanceBody();
      }, PSUI.AUTOSAVE_DEBOUNCE_MS));
      document.getElementById('setAllHadirButton').addEventListener('click', cycleSetAllStatuses);
      document.getElementById('clearAllButton').addEventListener('click', clearAllStatuses);
      document.getElementById('copyLatestButton').addEventListener('click', copyLatestStatuses);
      document.getElementById('undoButton').addEventListener('click', undoModalChange);
      document.getElementById('redoButton').addEventListener('click', redoModalChange);
      document.getElementById('rekapAbsensiButton').addEventListener('click', openAbsensiRekapPanel);
      document.getElementById('closeAbsensiRekapButton').addEventListener('click', closeAbsensiRekapPanel);
      document.getElementById('absensiRekapOverlay').addEventListener('click', function(event) {
        if (event.target === document.getElementById('absensiRekapOverlay')) closeAbsensiRekapPanel();
      });

      document.getElementById('attendanceBody').addEventListener('click', event => {
        if (state.modal.longPressHandled) {
          state.modal.longPressHandled = false;
          event.preventDefault();
          return;
        }
        const dateButton = event.target.closest('[data-select-date]');
        if (dateButton) {
          selectModalDate(dateButton.getAttribute('data-select-date'));
          return;
        }
        const matrixCell = event.target.closest('[data-matrix-cell]');
        if (matrixCell) {
          const dateValue = matrixCell.getAttribute('data-date');
          const santriId = matrixCell.getAttribute('data-santri-id');
          cycleCellStatus(dateValue, santriId);
        }
      });

      document.getElementById('attendanceBody').addEventListener('pointerdown', startColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointerup', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointerleave', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointercancel', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('contextmenu', event => {
        if (event.target.closest('[data-matrix-cell], [data-day-cell]')) {
          event.preventDefault();
        }
      });

      document.getElementById('attendanceBody').addEventListener('keydown', event => {
        const key = String(event.key || '').toLowerCase();
        const isActivateKey = key === 'enter' || key === ' ';

        const matrixCell = event.target.closest('[data-matrix-cell]');
        if (matrixCell) {
          const santriId = matrixCell.getAttribute('data-santri-id');
          const dateValue = matrixCell.getAttribute('data-date');
          if (isActivateKey) {
            event.preventDefault();
            cycleCellStatus(dateValue, santriId);
            return;
          }
          if (key === 'h') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'hadir');
            return;
          }
          if (key === 'i') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'izin');
            return;
          }
          if (key === 's') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'sakit');
            return;
          }
          if (key === 'a') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'alfa');
            return;
          }
          if (key === 't') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'tugas');
            return;
          }
          if (key === 'n') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'hari_tidak_aktif');
            return;
          }
          if (key === 'delete' || key === 'backspace' || key === 'x') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, '');
          }
          return;
        }

        // matrix-day-btn & matrix-name-cell dulu <button> asli (Enter/Space aktivasi otomatis
        // dari browser) -- sekarang div biasa demi performa render, jadi aktivasi keyboard-nya
        // perlu ditangani manual di sini supaya tetap bisa dipakai tanpa mouse.
        if (!isActivateKey) return;
        const dateButton = event.target.closest('[data-select-date]');
        if (dateButton) {
          event.preventDefault();
          selectModalDate(dateButton.getAttribute('data-select-date'));
        }
      });
    }

    const session = getStoredSession();
    if (!session) {
      clearSession();
      window.location.replace('/pages/login/');
    } else if (window.PSAccess && window.PSAccess.redirectIfForbidden(session, '/pages/halaqohAbsensi/')) {
      // redirected
    } else {
      state.session = session;
      state.today = todayDate();
      mountShell(session);
      bindEvents();
      window.addEventListener('load', async () => {
        try {
          await loadDashboardData(false);
          const openHalaqohId = new URLSearchParams(location.search).get('openHalaqoh');
          if (openHalaqohId) {
            history.replaceState(null, '', location.pathname);
            await openAttendanceModal(openHalaqohId);
          }
        } catch (error) {
          showNotice(error.message || 'Gagal memuat halaman absensi halaqoh.', 'error');
        }
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
