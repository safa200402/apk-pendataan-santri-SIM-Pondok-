<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#bf9030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../../shared-ui.css">
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css">
  <script src="../../shared-ui.js"></script>
  <title>Login Pendataan Santri</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    :root {
      --page-bg: #f5ecd7;
      --page-ink: #333333;
      --page-muted: rgba(51, 51, 51, 0.62);
      --page-line: rgba(51, 51, 51, 0.14);
      --page-panel: rgba(255, 223, 175, 0.88);
      --page-emerald: #bf9030;
      --page-emerald-soft: #d3aa48;
      --page-copper: #9b7729;
      --page-gold: #e0bc66;
      --page-shadow: 0 26px 80px rgba(51, 51, 51, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      opacity: 0.36;
      mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
    }

    body::after {
      opacity: 0.55;
    }

    .notice-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .notice-stack .message {
      display: block;
      margin: 0;
      pointer-events: auto;
    }

    .page {
      width: 100%;
      min-height: calc(100vh - 40px);
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
    }

    .login-card {
      display: grid;
      gap: 18px;
      width: min(100%, 460px);
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 6px;
    }

    .login-card::after {
      content: "";
      position: absolute;
      top: 16px;
      right: -32px;
      width: 140px;
      height: 140px;
      pointer-events: none;
    }

    .login-card > * {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2.5rem, 10vw, 3.4rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    form {
      display: grid;
      gap: 14px;
      width: min(100%, 520px);
      margin: 0 auto;
    }

    input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      font: inherit;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
    }

    input:focus {
      transform: translateY(-1px);
    }

    .password-field {
      position: relative;
    }

    .password-field input {
      width: 100%;
      padding-right: 52px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 12px !important;
      background: transparent !important;
      color: var(--page-copper) !important;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: color 0.18s ease, background-color 0.18s ease;
    }

    .password-toggle:hover {
      background: rgba(155, 119, 41, 0.12) !important;
      color: var(--page-emerald) !important;
    }

    .password-toggle:active {
      transform: translateY(-50%) scale(0.92);
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .secondary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      padding: 0 18px;
      border: 0;
      border-radius: 18px;
      cursor: pointer;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.primary {
      box-shadow: 0 16px 28px rgba(191, 144, 48, 0.22);
    }

    .btn.secondary {
      border: 1px solid var(--page-line);
      box-shadow: 0 12px 24px rgba(48, 37, 24, 0.08);
    }

    .btn.compact {
      width: auto;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      box-shadow: 0 8px 18px rgba(48, 37, 24, 0.07);
    }

    .message {
      display: none;
      padding: 15px 16px;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.7;
    }

    .message.show {
      display: block;
    }

    .role-warning {
      display: grid;
      gap: 10px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(155, 119, 41, 0.4);
      background: rgba(224, 188, 102, 0.3);
      color: var(--page-ink);
    }

    .role-warning-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .role-warning-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .role-warning p {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.65;
      color: var(--page-muted);
    }

    .role-warning p b {
      color: var(--page-ink);
    }

    .role-warning-cta {
      margin-top: 6px !important;
      justify-self: end !important;
      width: auto !important;
      min-height: 30px !important;
      padding: 4px 12px !important;
      border-radius: 999px !important;
      text-transform: none !important;
      letter-spacing: 0.02em !important;
      font-size: 0.68rem !important;
      font-weight: 800 !important;
      box-shadow: 0 6px 14px rgba(191, 144, 48, 0.18) !important;
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .login-card.is-revealing {
        width: min(70%, 760px);
        min-height: min(62vh, 640px);
        padding: 40px;
        align-content: center;
      }
    }

    @media (min-width: 1200px) {
      .login-card.is-revealing {
        width: min(50%, 720px);
        min-height: min(56vh, 600px);
        padding: 42px 44px;
        align-content: center;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

    .page {
        min-height: calc(100vh - 28px);
      }

    .login-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="notice-stack" id="noticeStack" popover="manual"></div>

  <main class="page">
    <section class="login-card is-revealing">
      <h1>Login Pengurus</h1>
      <div class="role-warning" role="alert">
        <div class="role-warning-head">
          <span class="role-warning-icon" aria-hidden="true">&#9888;&#65039;</span>
          <span>Halaman Login Pengurus</span>
        </div>
        <p>Halaman ini <b>khusus pengurus / ustadz</b>. Kalau Anda <b>wali santri atau santri</b>, ini <b>bukan</b> halaman Anda &mdash; silakan masuk lewat halaman <b>Login Santri</b>.</p>
        <a class="btn primary role-warning-cta" href="/pages/loginSantri/">Saya wali santri / santri <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i> ke Login Santri</a>
      </div>
      <form id="loginForm">
        <input type="text" id="username" autocomplete="username" placeholder="Username" aria-label="Username pengurus" required>
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" aria-label="Password" data-ps-password-toggle="off" required>
          <button type="button" id="togglePassword" class="password-toggle" aria-label="Tampilkan password" aria-pressed="false">
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
          </button>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Masuk</button>
          <div class="secondary-actions">
            <a class="btn secondary compact" href="/">Kembali</a>
            <a class="btn secondary compact" href="/pages/loginSantri/">Login santri</a>
            <a class="btn secondary compact" href="/pages/madingPublik/">Mading Publik</a>
          </div>
        </div>
      </form>
    </section>
  </main>

  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = {
      token: 'ps_token',
      session: 'ps_session'
    };

    const form = document.getElementById('loginForm');
    const nameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    let currentMessageId = '';
    let messageCounter = 0;

    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        const willShow = passwordInput.type === 'password';
        passwordInput.type = willShow ? 'text' : 'password';
        togglePasswordBtn.setAttribute('aria-pressed', String(willShow));
        togglePasswordBtn.setAttribute('aria-label', willShow ? 'Sembunyikan password' : 'Tampilkan password');
        const icon = togglePasswordBtn.querySelector('i');
        if (icon) icon.className = willShow ? 'fa-solid fa-lock-open' : 'fa-solid fa-lock';
        passwordInput.focus();
      });
    }

    function createMessageElement(text, type = 'info') {
      const element = document.createElement('div');
      element.className = `message show ${type}`;
      element.dataset.messageId = `msg-${Date.now()}-${messageCounter += 1}`;
      element.textContent = text;
      return element;
    }

    function removeMessage(id) {
      const element = document.querySelector(`[data-message-id="${id}"]`);
      if (element) element.remove();
      if (currentMessageId === id) currentMessageId = '';
    }

    function clearMessage() {
      if (!currentMessageId) return;
      removeMessage(currentMessageId);
    }

    function showMessage(text, type = 'info') {
      clearMessage();
      const element = createMessageElement(text, type);
      const stack = document.getElementById('noticeStack');
      stack.prepend(element);
      currentMessageId = element.dataset.messageId;
      if (stack.matches(':popover-open')) stack.hidePopover();
      stack.showPopover();
      return currentMessageId;
    }

    function clearSession() {
      localStorage.removeItem(STORAGE.token);
      localStorage.removeItem(STORAGE.session);
    }

    function saveSession(token, session) {
      localStorage.setItem(STORAGE.token, token);
      localStorage.setItem(STORAGE.session, JSON.stringify(session));
    }

    function getToken() {
      return localStorage.getItem(STORAGE.token) || '';
    }

    function toParams(data) {
      const params = new URLSearchParams();
      Object.entries(data).forEach(([key, value]) => {
        if (value === undefined || value === null) return;
        params.append(key, typeof value === 'object' ? JSON.stringify(value) : String(value));
      });
      return params;
    }

    async function requestApi(action, payload = {}, method = 'GET', includeToken = true) {
      const data = { action, ...payload };
      if (includeToken) {
        const token = getToken();
        if (!token) {
          const error = new Error('Belum ada token sesi.');
          error.code = 401;
          throw error;
        }
        data.token = token;
      }

      const response = method === 'GET'
        ? await fetch(`${API_BASE}?${toParams(data).toString()}`)
        : await fetch(API_BASE, {
            method,
            body: toParams(data)
          });

      const json = await response.json();
      if (!json.ok) {
        const error = new Error(json.error?.message ? `Server mengatakan: ${json.error.message}` : 'Permintaan gagal.');
        error.code = json.error?.code || response.status || 500;
        throw error;
      }
      return json.data;
    }

    async function validateExistingSession() {
      const token = getToken();
      if (!token) {
        return false;
      }
      try {
        const data = await requestApi('session');
        if (data.session?.role === 'pengurus') {
          saveSession(token, data.session);
          window.location.replace('/pages/beranda/');
          return true;
        }
        if (data.session?.role === 'santri') {
          saveSession(token, data.session);
          window.location.replace('/pages/beranda/');
          return true;
        }
      } catch (error) {
        clearSession();
      }
      return false;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const username = nameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        showMessage('Username dan password wajib diisi.', 'error');
        return;
      }

      const submitBtn = event.submitter || form.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.disabled = true;
      showMessage('Memeriksa kredensial...', 'info');

      try {
        const data = await requestApi('login', { username, password }, 'POST', false);
        if (!data.session || data.session.role !== 'pengurus') {
          throw new Error('Akun ini bukan pengurus aktif.');
        }
        saveSession(data.token, data.session);
        showMessage(`Login berhasil sebagai ${data.session.name}. Mengalihkan...`, 'success');
        setTimeout(() => {
          window.location.replace('/pages/beranda/');
        }, 650);
      } catch (error) {
        clearSession();
        showMessage(error.message || 'Login gagal.', 'error');
        if (submitBtn) submitBtn.disabled = false;
      }
    });

    window.addEventListener('load', async () => {
      if (window.location.protocol === 'file:') {
        showMessage('Halaman ini sedang dibuka via file://. Jalankan lewat local server, misalnya http://localhost:5500/login.html, agar sesi dan request browser stabil.', 'error');
        return;
      }
      showMessage('Memeriksa sesi tersimpan...', 'info');
      const redirected = await validateExistingSession();
      if (!redirected) {
        clearMessage();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }

    fetch('/api?action=portal.brand.public.get', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (json) {
        var brand = json && json.ok && json.data && json.data.brand;
        if (!brand) return;
        var logoUrl = brand.logoUrl;
        if (logoUrl && !logoUrl.startsWith('http') && !logoUrl.startsWith('/') && !logoUrl.startsWith('data:')) {
          logoUrl = '/' + logoUrl;
        }
        var orgName = brand.organizationName;
        if (logoUrl) {
          var favicon = document.querySelector('link[rel="icon"]');
          if (favicon) { favicon.href = logoUrl; favicon.type = logoUrl.endsWith('.svg') ? 'image/svg+xml' : 'image/png'; }
        }
        if (orgName) {
          document.title = 'Login — ' + orgName;
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
