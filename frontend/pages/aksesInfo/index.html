<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Info Akses</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap');
    :root {
      --paper: #f6efe0;
      --ink: #4d4034;
      --muted: #7b6a58;
      --line: rgba(91, 73, 57, 0.15);
      --accent: #b97650;
      --success: #74846c;
      --danger: #a55a52;
      --warning: #b58439;
      --shadow: 0 18px 45px rgba(87, 67, 51, 0.18);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }

    h1, h2, h3 { margin: 0 0 10px; text-transform: uppercase; }
    p { margin: 0; line-height: 1.65; }

    .panel { padding: 22px; }

    button { font: inherit; padding: 12px 18px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .tab-btn {
      padding: 10px 20px;
      font-size: 13px;
      border-radius: 999px;
      border: 2px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-btn:not(.active) { background: var(--line); border-color: transparent; color: var(--ink); }
    .tab-btn:not(.active):hover { opacity: 0.75; }

    .tab-panel { display: none; }
    .tab-panel.active { display: grid; gap: 12px; }

    details {
      border: 1px dashed rgba(111, 87, 69, 0.22);
      border-radius: 18px;
      padding: 0;
      background: rgba(255, 251, 243, 0.72);
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      font-weight: 700;
      list-style: none;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary:hover { background: rgba(185, 118, 80, 0.06); }

    .summary-title {
      flex: 1;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-chevron {
      font-size: 12px;
      opacity: 0.45;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    details[open] > summary .summary-chevron { transform: rotate(180deg); }

    .page-row-icon,
    .summary-page-icon {
      width: 20px;
      text-align: center;
      flex-shrink: 0;
      color: var(--muted);
    }

    .details-body {
      padding: 4px 18px 18px;
      border-top: 1px dashed rgba(111, 87, 69, 0.18);
      display: grid;
      gap: 14px;
    }

    /* level badges */
    .level-badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 0 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge-super       { background: rgba(124,58,237,0.12);  color: #6d28d9; }
    .badge-admin       { background: rgba(165,90,82,0.12);   color: var(--danger); }
    .badge-mudir       { background: rgba(185,118,80,0.14);  color: var(--accent); }
    .badge-akademik    { background: rgba(37,99,235,0.10);   color: #1d4ed8; }
    .badge-koordinator { background: rgba(5,150,105,0.10);   color: #047857; }
    .badge-pengampu    { background: rgba(16,185,129,0.10);  color: #065f46; }
    .badge-pengajar    { background: rgba(181,132,57,0.14);  color: var(--warning); }
    .badge-penguji     { background: rgba(99,102,241,0.10);  color: #4338ca; }
    .badge-kesehatan   { background: rgba(20,184,166,0.12);  color: #0f766e; }
    .badge-sdm         { background: rgba(59,130,246,0.10);  color: #1d4ed8; }
    .badge-ksantrian   { background: rgba(245,158,11,0.12);  color: #b45309; }
    .badge-kebersihan  { background: rgba(134,239,172,0.18); color: #166534; }
    .badge-operator    { background: rgba(139,92,246,0.10);  color: #7c3aed; }
    .badge-staff       { background: rgba(91,73,57,0.10);    color: var(--muted); }

    .sub-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 10px 0 4px;
    }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(91, 73, 57, 0.07);
      border: 1px solid rgba(91, 73, 57, 0.12);
      color: var(--ink);
    }

    .page-list { display: grid; gap: 6px; }

    .page-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(246, 239, 224, 0.8);
      border: 1px solid rgba(91, 73, 57, 0.1);
      font-size: 13px;
    }
    .page-row-icon { font-size: 15px; flex-shrink: 0; margin-top: 2px; }
    .page-row-inner { flex: 1; min-width: 0; }
    .page-row-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
    .page-row-desc  { font-size: 11px; color: var(--muted); line-height: 1.4; display: block; margin-top: 2px; }

    .level-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.65;
      padding: 10px 13px;
      background: rgba(91,73,57,0.04);
      border-radius: 10px;
      border-left: 3px solid rgba(91,73,57,0.18);
    }

    .page-desc-banner {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
      padding: 8px 13px;
      background: rgba(91,73,57,0.04);
      border-radius: 10px;
      border-left: 3px solid rgba(185,118,80,0.3);
    }

    .all-access {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(116, 132, 108, 0.1);
      border: 1px dashed rgba(116, 132, 108, 0.4);
      color: var(--success);
    }

    .loading-state {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="notice-stack" id="noticeStack" popover="manual"></div>
  <main>
    <div class="app-layout">
      <section class="panel nav" id="nav"></section>
      <div class="content-stack">
        <section class="panel">
          <h2>Info Akses</h2>
          <p style="color:var(--muted);font-size:14px;">Lihat halaman apa saja yang dapat diakses oleh setiap jabatan, dan jabatan mana yang dapat mengakses setiap halaman.</p>
          <div class="toolbar">
            <button class="tab-btn active" type="button" data-tab="byJabatan">Per Jabatan</button>
            <button class="tab-btn" type="button" data-tab="byPage">Per Halaman</button>
          </div>
        </section>

        <section class="panel">
          <div class="tab-panel active" id="tabByJabatan">
            <div class="loading-state" id="jabatanLoading">Memuat data jabatan...</div>
          </div>
          <div class="tab-panel" id="tabByPage"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = { token: 'ps_token', session: 'ps_session' };

    function getToken() { return localStorage.getItem(STORAGE.token) || ''; }
    function getStoredSession() {
      try { return JSON.parse(localStorage.getItem(STORAGE.session) || 'null'); } catch { return null; }
    }
    function toParams(data) {
      const p = new URLSearchParams();
      Object.entries(data).forEach(([k, v]) => { if (v != null) p.append(k, v); });
      return p;
    }
    async function api(action, payload = {}) {
      const token = getToken();
      const res = await fetch(`${API_BASE}?${toParams({ action, token, ...payload })}`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error?.message || 'Gagal');
      return json.data;
    }

    /* ── keyword matching (sesuai ACCESS_KEYWORDS di shared-access.js) ── */
    const KW = {
      superAdmin:   ['super admin', 'superadmin'],
      jamDigital:   ['operator jam digital'],
      admin:        ['admin', 'administrator', 'operator'],
      mudir:        ['mudir', 'mudiroh', "mudir 'amm", 'mudir amm', "mudirul ma'had", 'mudirul mahad'],
      halaqohCoord: ['koordinator halaqoh', 'kordinator halaqoh', 'koord halaqoh'],
      pengampu:     ['pengampu halaqoh', 'pengampu', 'musyrif halaqoh', 'murobbi halaqoh'],
      penguji:      ['penguji hafalan', 'penguji'],
      academic:     ['akademik'],
      teacher:      ['pengajar', 'ustadz', 'ustadzah', 'guru'],
      kesehatan:    ['kesehatan', 'bagian kesehatan', 'seksi kesehatan', 'bidang kesehatan', 'klinik', 'uks', 'kesehatan santri'],
      sdm:          ['sdm', 'sumber daya manusia', 'hr', 'human resources', 'kepegawaian', 'personalia', 'bagian sdm', 'seksi sdm'],
      ksantrian:    ['ksantrian', 'kesantrian', 'bagian kesantrian', 'staf kesantrian', 'seksi kesantrian', 'bidang kesantrian'],
      kebersihan:   ['kebersihan', 'kebersihan lingkungan', 'bagian kebersihan', 'seksi kebersihan', 'bidang kebersihan', 'petugas kebersihan'],
    };

    function norm(s) { return String(s||'').toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim(); }
    function matchAny(label, kws) { const n = norm(label); return kws.some(k => n === k || n.includes(k)); }
    function getLevel(name) {
      if (matchAny(name, KW.superAdmin))   return 'super_admin';
      if (matchAny(name, KW.jamDigital))   return 'operator_jam_digital';
      if (matchAny(name, KW.admin))        return 'admin';
      if (matchAny(name, KW.mudir))        return 'mudir';
      if (matchAny(name, KW.academic))     return 'akademik';
      if (matchAny(name, KW.halaqohCoord)) return 'koordinator_halaqoh';
      if (matchAny(name, KW.pengampu))     return 'pengampu_halaqoh';
      if (matchAny(name, KW.penguji))      return 'penguji_hafalan';
      if (matchAny(name, KW.teacher))      return 'pengajar';
      if (matchAny(name, KW.kesehatan))    return 'kesehatan';
      if (matchAny(name, KW.sdm))          return 'sdm';
      if (matchAny(name, KW.ksantrian))    return 'ksantrian';
      if (matchAny(name, KW.kebersihan))   return 'kebersihan';
      return 'staff';
    }

    /* ── Semua halaman yang ditampilkan di tab Per Halaman ── */

      '/pages/rekapAbsensiPengurus/':   'Cek rekap kehadiran pengurus lewat kalender bulanan',
      '/pages/kelolaMading/':           'Publikasi konten mading untuk pengurus, umum, dan santri',
      '/pages/portalSettings/':         'Atur logo, nama, dan branding organisasi (Super Admin only)',
      '/pages/superAdmin/':             'Operasi massal otomatis: reset password, username, dan sesi',
      '/pages/kaldik/':                 'Lihat jadwal dan agenda kegiatan akademik',
      '/pages/editKaldik/':             'Tambah dan kelola agenda kalender akademik',
      '/pages/jamDigital/':             'Viewer jam digital untuk ditampilkan di layar TV masjid',
      '/pages/jamDigitalRemote/':       'Kendalikan tampilan jam digital TV masjid secara remote',
      '/pages/skemaDb/':                'Struktur dan relasi tabel database sistem (referensi teknis)',
      '/pages/aksesInfo/':              'Lihat akses halaman per jabatan dan per halaman',
      '/pages/infoHalaman/':            'Panduan fitur, akses, dan makna warna seluruh halaman sistem',
      '/pages/accountProfile/':         'Kelola foto profil, TTD, dan data akun yang sedang aktif',
      '/pages/changePassword/':         'Ubah password akun yang sedang aktif',
    };

    const PAGE_ICONS = {
      '/':                              'fa-solid fa-house',
      '/pages/madingDigital/':          'fa-solid fa-newspaper',
      '/pages/dashboardAdmin/':         'fa-solid fa-chart-pie',
      '/pages/dashboardKoordHalaqoh/':  'fa-solid fa-circle-check',
      '/pages/dashboardAkademik/':      'fa-solid fa-chalkboard-user',
      '/pages/dashboardKesantrian/':    'fa-solid fa-triangle-exclamation',
      '/pages/dashboard/':              'fa-solid fa-chart-bar',
      '/pages/jadwalIbadah/':           'fa-solid fa-mosque',
      '/pages/jadwalPiket/':            'fa-solid fa-broom',
      '/pages/daftarSantri/':             'fa-solid fa-user-pen',
      '/pages/tahunAjaran/':            'fa-solid fa-calendar',
      '/pages/editHalaqoh/':            'fa-solid fa-book-open',
      '/pages/halaqohAbsensi/':         'fa-solid fa-clipboard-list',
      '/pages/hafalanHarian/':          'fa-solid fa-book-open-reader',
      '/pages/ujianHafalan/':           'fa-solid fa-star-and-crescent',
      '/pages/nilaiUas/':               'fa-solid fa-scroll',
      '/pages/editKelas/':              'fa-solid fa-school',
      '/pages/inputKelasLevel/':        'fa-solid fa-layer-group',
      '/pages/kelasAbsensi/':           'fa-solid fa-clipboard-check',
      '/pages/nilaiUjian/':             'fa-solid fa-file-pen',
      '/pages/editSoal/':               'fa-solid fa-file-lines',
      '/pages/editRegu/':               'fa-solid fa-flag',
      '/pages/perkembanganSantri/':     'fa-solid fa-seedling',
      '/pages/perkembanganTemplate/':   'fa-solid fa-wand-magic-sparkles',
      '/pages/raport&rekamJejak/':      'fa-solid fa-address-card',
      '/pages/akhlakKepribadian/':      'fa-solid fa-heart',
      '/pages/deskripsiSantri/':        'fa-solid fa-pen-fancy',
      '/pages/pelanggaran/':            'fa-solid fa-gavel',
      '/pages/santriSakit/':            'fa-solid fa-kit-medical',
      '/pages/izinPulang/':             'fa-solid fa-person-walking-luggage',
      '/pages/masterJabatan/':          'fa-solid fa-tags',
      '/pages/editPengurus/':           'fa-solid fa-user-gear',
      '/pages/kegiatanSop/':            'fa-solid fa-thumbtack',
      '/pages/koordinatAbsensi/':       'fa-solid fa-location-dot',
      '/pages/inputAbsensiPengurus/':   'fa-solid fa-fingerprint',
      '/pages/rekapAbsensiPengurus/':   'fa-solid fa-calendar-check',
      '/pages/kelolaMading/':           'fa-solid fa-bullhorn',
      '/pages/portalSettings/':         'fa-solid fa-gear',
      '/pages/superAdmin/':             'fa-solid fa-shield-halved',
      '/pages/kaldik/':                 'fa-solid fa-calendar-days',
      '/pages/editKaldik/':             'fa-solid fa-calendar-pen',
      '/pages/jamDigital/':             'fa-solid fa-clock',
      '/pages/jamDigitalRemote/':       'fa-solid fa-satellite-dish',
      '/pages/skemaDb/':                'fa-solid fa-database',
      '/pages/aksesInfo/':              'fa-solid fa-circle-info',
      '/pages/infoHalaman/':            'fa-solid fa-book',
      '/pages/accountProfile/':         'fa-solid fa-circle-user',
      '/pages/changePassword/':         'fa-solid fa-key',
    };

    function pageIcon(href) {
      const cls = PAGE_ICONS[href] || 'fa-solid fa-file';
      return `<i class="${cls}"></i>`;
    }

    function pageLabel(href) {
      const item = window.PSNav && PSNav.findItem(href);
      return item ? item.label.replace(/^\*+\s*/, '') : href;
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function pageRowHtml(href) {
      const desc = PAGE_DESCRIPTIONS[href] || '';
      return `<div class="page-row">
        <span class="page-row-icon">${pageIcon(href)}</span>
        <span class="page-row-inner">
          <span class="page-row-label">${esc(pageLabel(href))}</span>
          ${desc ? `<span class="page-row-desc">${esc(desc)}</span>` : ''}
        </span>
      </div>`;
    }

    function buildLevelDetails(level, jabatanList) {
      const isAll = level.pages === 'all';
      const chips = jabatanList.length
        ? jabatanList.map(j => `<span class="chip">${esc(j)}</span>`).join('')
        : `<span class="chip" style="opacity:.45">—</span>`;

      const noteHtml = level.note
        ? `<p style="font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6"><i class="fa-solid fa-circle-exclamation" style="margin-right:5px;opacity:.55"></i>${esc(level.note)}</p>`
        : '';

      const pagesHtml = isAll
        ? `<div class="all-access"><i class="fa-solid fa-check-circle"></i> Semua halaman dapat diakses</div>${noteHtml}`
        : `<div class="page-list">${level.pages.map(pageRowHtml).join('')}</div>`;

      const descHtml = level.description
        ? `<p class="level-desc">${esc(level.description)}</p>`
        : '';

      return `
        <details>
          <summary>
            <span class="summary-title">${esc(level.label)}</span>
            <span class="level-badge ${level.badge}">${esc(level.label)}</span>
            <span class="summary-chevron"><i class="fa-solid fa-chevron-down"></i></span>
          </summary>
          <div class="details-body">
            ${descHtml}
            <div>
              <p class="sub-label">Jabatan dengan level ini</p>
              <div class="chip-row">${chips}</div>
            </div>
            <div>
              <p class="sub-label">Halaman yang dapat diakses</p>
              ${pagesHtml}
            </div>
          </div>
        </details>`;
    }

    function buildPageDetails(href, accessLevels, jabatanMap) {
      const label = pageLabel(href);
      const desc = PAGE_DESCRIPTIONS[href] || '';
      const badges = accessLevels.map(l =>
        `<span class="level-badge ${l.badge}">${esc(l.label)}</span>`).join(' ');
      const jabatan = [];
      accessLevels.forEach(l => (jabatanMap[l.key] || []).forEach(j => jabatan.push(j)));
      const chips = jabatan.length
        ? jabatan.map(j => `<span class="chip">${esc(j)}</span>`).join('')
        : `<span class="chip" style="opacity:.45">—</span>`;

      const descHtml = desc
        ? `<p class="page-desc-banner">${esc(desc)}</p>`
        : '';

      return `
        <details>
          <summary>
            <span class="page-row-icon">${pageIcon(href)}</span>
            <span class="summary-title">${esc(label)}</span>
            <span class="summary-chevron"><i class="fa-solid fa-chevron-down"></i></span>
          </summary>
          <div class="details-body">
            ${descHtml}
            <div>
              <p class="sub-label">Level akses</p>
              <div class="chip-row" style="gap:6px">${badges || '<span class="chip" style="opacity:.45">—</span>'}</div>
            </div>
            <div>
              <p class="sub-label">Jabatan yang dapat mengakses</p>
              <div class="chip-row">${chips}</div>
            </div>
          </div>
        </details>`;
    }

    function buildByPage(jabatanMap) {
      return ALL_PAGES.map(href => {
        const accessLevels = LEVELS.filter(l =>
          l.pages === 'all' || (Array.isArray(l.pages) && l.pages.includes(href)));
        return buildPageDetails(href, accessLevels, jabatanMap);
      }).join('');
    }

    /* ── tabs ── */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        document.getElementById('tabByJabatan').classList.toggle('active', tab === 'byJabatan');
        document.getElementById('tabByPage').classList.toggle('active', tab === 'byPage');
      });
    });

    /* ── init ── */
    window.addEventListener('load', async () => {
      if (window.PSAccess && window.PSAccess.redirectIfForbidden(getStoredSession(), 'aksesInfo.html')) return;
      PSShell.mount({ currentPage: 'aksesInfo.html', getStoredSession, storageKey: STORAGE.session });

      let jabatanNames = [];
      try {
        const data = await api('jabatan.names');
        jabatanNames = data.names || [];
      } catch { jabatanNames = []; }

      const jabatanMap = {};
      LEVELS.forEach(l => { jabatanMap[l.key] = []; });
      jabatanNames.forEach(name => {
        const lv = getLevel(name);
        if (jabatanMap[lv]) jabatanMap[lv].push(name);
      });

      document.getElementById('tabByJabatan').innerHTML =
        LEVELS.map(l => buildLevelDetails(l, jabatanMap[l.key] || [])).join('');

      document.getElementById('tabByPage').innerHTML = buildByPage(jabatanMap);
    });
  </script>
</body>
</html>
