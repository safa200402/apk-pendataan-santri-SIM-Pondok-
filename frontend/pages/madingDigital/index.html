<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#c99a28">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../../shared-ui.css">
  <link rel="stylesheet" href="../../shared-shell.css">
  <script src="../../shared-ui.js"></script>
  <title>Mading Digital</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }

    .content-stack > .panel { padding: 20px 24px; }

    .search-row { display: grid; gap: 8px; }
    .search-row label { font-weight: 700; font-size: 14px; display: grid; gap: 6px; }
    .search-row input[type="search"] {
      width: 100%; min-height: 46px; padding: 10px 16px;
      font: inherit; font-size: 15px;
      border-radius: 12px; border: 2px solid rgba(0,0,0,0.12);
      outline: none; background: rgba(255,255,255,0.8);
    }
    .search-row input[type="search"]:focus { border-color: rgba(196,154,44,0.6); }

    .section-label {
      font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; opacity: 0.55; margin: 0 0 12px;
    }

    .content-flex { display: flex; flex-wrap: wrap; gap: 14px; }

    .content-card {
      padding: 20px; border-radius: 16px;
      background: rgba(255, 248, 230, 0.96) !important;
      border: 1px solid rgba(0,0,0,0.08);
      display: grid; gap: 8px; align-content: start; width: 100%;
    }
    .content-card h3 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.35; }
    .content-card p { margin: 0; font-size: 14px; line-height: 1.7; opacity: 0.8; }

    .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chip {
      display: inline-flex; align-items: center;
      min-height: 28px; padding: 0 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
      background: rgba(0,0,0,0.07);
    }
    .chip-pengurus { background: rgba(91,33,182,0.1); color: #5b21b6; }

    .card-foot { display: flex; align-items: center; justify-content: flex-end; margin-top: 4px; }
    .btn-view {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 34px; padding: 0 14px; border-radius: 8px;
      font-size: 13px; font-weight: 700;
      border: 2px solid rgba(0,0,0,0.15); background: transparent; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-view:hover { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.25); }

    .empty-state { padding: 20px; text-align: center; opacity: 0.6; font-size: 14px; }

    .pagination {
      display: flex; align-items: center; gap: 8px;
      flex-wrap: wrap; justify-content: center; margin-top: 8px;
    }
    .pagination button {
      min-height: 36px; min-width: 36px; padding: 0 12px;
      border-radius: 8px; font-size: 13px; font-weight: 700;
      border: 2px solid rgba(0,0,0,0.12); background: transparent; cursor: pointer;
      transition: background 0.15s;
    }
    .pagination button:hover:not(:disabled) { background: rgba(0,0,0,0.06); }
    .pagination button.active { background: rgba(196,154,44,0.2); border-color: rgba(196,154,44,0.5); }
    .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }

    .view-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.08); flex-shrink: 0;
    }
    .view-head h2 { margin: 0 0 8px; font-size: 1.2rem; line-height: 1.3; }
    .view-head-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .view-body { flex: 1; overflow-y: auto; padding: 24px; line-height: 1.8; font-size: 15px; }
    .view-body img { max-width: 100%; height: auto; }

    @media (max-width: 700px) {
      #pageLayout { grid-template-columns: 1fr; }
      .guest-sidebar { position: static; height: auto; }
      .gs-brand { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="notice-stack" id="noticeStack" popover="manual"></div>

  <dialog class="ps-floating-dialog" id="viewDialog" aria-modal="true">
    <div class="dialog-body ps-dialog-shell">
      <div class="ps-dialog-header view-head">
        <div>
          <h2 id="viewTitle"></h2>
          <div class="view-head-meta" id="viewMeta"></div>
        </div>
        <button class="ps-dialog-close" id="closeView" type="button" aria-label="Tutup">&times;</button>
      </div>
      <div class="view-body" id="viewBody"></div>
    </div>
  </dialog>

  <div id="pageLayout">

    <!-- #nav: diisi PSShell.mount() saat login. Tanpa class .panel supaya tidak di-style shared-ui.css. -->
    <section class="shell-sidebar" id="nav"></section>

    <main>
      <div class="content-stack">

        <section class="panel">
          <div class="section-head">
            <div class="section-title-wrap">
              <h1 class="section-title">Mading Digital</h1>
              <p class="section-desc" id="pageDesc">Memuat konten...</p>
            </div>
          </div>
          <div class="search-row" style="margin-top:16px">
            <label>
              Cari judul atau isi
              <input type="search" id="searchInput" placeholder="Ketik kata kunci...">
            </label>
          </div>
        </section>

        <section class="panel">
          <div id="contentArea"><p class="empty-state">Memuat...</p></div>
        </section>

      </div>
    </main>

  </div><!-- #pageLayout -->

  <script src="../../shared-access.js"></script>
  <script src="../../shared-nav.js"></script>
  <script src="../../shared-shell.js"></script>
  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = { token: 'ps_token', session: 'ps_session' };

    const PAGE_SIZE = 10;
    let allItems = [];
    let currentPage = 1;
    let currentRole = null;

    function getToken() { return localStorage.getItem(STORAGE.token) || ''; }
    function getStoredSession() { try { return JSON.parse(localStorage.getItem(STORAGE.session) || 'null'); } catch { return null; } }
    function saveSession(s) { localStorage.setItem(STORAGE.session, JSON.stringify(s)); }
    function clearSession() { localStorage.removeItem(STORAGE.token); localStorage.removeItem(STORAGE.session); }

    function redirectLogin(role) {
      clearSession();
      window.location.replace(role === 'santri' ? '/pages/loginSantri/' : '/pages/login/');
    }

    function toPlainText(html) {
      const el = document.createElement('div');
      el.innerHTML = html || '';
      return (el.textContent || el.innerText || '').trim();
    }

    function matchesQuery(item, q) {
      if (!q) return true;
      return [item.title, item.summary, toPlainText(item.body)].join(' ').toLowerCase().includes(q.toLowerCase());
    }

    async function apiFetch(action, token) {
      const p = new URLSearchParams({ action });
      if (token) p.set('token', token);
      const res = await fetch(`${API_BASE}?${p}`);
      const json = await res.json();
      if (!json.ok) {
        const e = new Error(json.error?.message || 'Gagal.');
        e.code = json.error?.code || 500;
        throw e;
      }
      return json.data;
    }

    function buildCard(item) {
      const isPengurus = item.targetRole === 'pengurus';
      return `
        <article class="content-card">
          <h3>${item.title || '-'}</h3>
          ${item.summary ? `<p>${item.summary}</p>` : (item.body ? `<p>${toPlainText(item.body).slice(0, 200)}</p>` : '')}
          <div class="card-meta">
            ${isPengurus ? `<span class="chip chip-pengurus">Khusus Pengurus</span>` : `<span class="chip">${item.targetRole || 'umum'}</span>`}
            <span class="chip">${item.publishedAt || '-'}</span>
          </div>
          <div class="card-foot">
            <button class="btn-view" type="button" data-view="${item.id || ''}">Lihat selengkapnya</button>
          </div>
        </article>`;
    }

    function buildPagination(total, page) {
      if (total <= PAGE_SIZE) return '';
      const totalPages = Math.ceil(total / PAGE_SIZE);
      const pages = [];
      for (let i = 1; i <= totalPages; i++)
        pages.push(`<button type="button" data-page="${i}" class="${i === page ? 'active' : ''}">${i}</button>`);
      return `<div class="pagination">
        <button type="button" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>&lsaquo; Prev</button>
        ${pages.join('')}
        <button type="button" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''}>Next &rsaquo;</button>
      </div>`;
    }

    function renderContent() {
      const q = document.getElementById('searchInput').value.trim();
      const filtered = allItems.filter(item => matchesQuery(item, q));
      const area = document.getElementById('contentArea');

      if (!filtered.length) {
        area.innerHTML = `<p class="empty-state">Tidak ada konten yang cocok.</p>`;
        return;
      }

      if (currentRole === 'pengurus') {
        const pengurus = filtered.filter(i => i.targetRole === 'pengurus');
        const umum     = filtered.filter(i => i.targetRole !== 'pengurus');
        let html = '';
        if (pengurus.length) {
          html += `<p class="section-label">Khusus Pengurus (${pengurus.length})</p>`;
          html += `<div class="content-flex">${pengurus.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE).map(buildCard).join('')}</div>`;
          html += buildPagination(pengurus.length, currentPage);
        }
        if (umum.length) {
          html += `<p class="section-label" style="margin-top:${pengurus.length ? 24 : 0}px">Informasi Umum (${umum.length})</p>`;
          html += `<div class="content-flex">${umum.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE).map(buildCard).join('')}</div>`;
          html += buildPagination(umum.length, currentPage);
        }
        area.innerHTML = html;
      } else {
        const paged = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
        area.innerHTML = `<div class="content-flex">${paged.map(buildCard).join('')}</div>${buildPagination(filtered.length, currentPage)}`;
      }

      area.querySelectorAll('[data-view]').forEach(btn =>
        btn.addEventListener('click', () => openView(btn.getAttribute('data-view'))));
      area.querySelectorAll('.pagination button[data-page]').forEach(btn =>
        btn.addEventListener('click', () => {
          const p = parseInt(btn.getAttribute('data-page'), 10);
          if (!p || p === currentPage) return;
          currentPage = p;
          renderContent();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
    }

    function openView(id) {
      const item = allItems.find(i => String(i.id) === String(id));
      if (!item) return;
      const isPengurus = item.targetRole === 'pengurus';
      document.getElementById('viewTitle').textContent = item.title || '-';
      document.getElementById('viewMeta').innerHTML = [
        isPengurus ? `<span class="chip chip-pengurus">Khusus Pengurus</span>` : `<span class="chip">${item.targetRole || 'umum'}</span>`,
        `<span class="chip">${item.publishedAt || '-'}</span>`
      ].join('');
      document.getElementById('viewBody').innerHTML = item.body || (item.summary ? `<p>${item.summary}</p>` : '<p>Tidak ada isi konten.</p>');
      document.getElementById('viewDialog').showModal();
    }

    document.getElementById('searchInput').addEventListener('input', PSUI.debounce(() => { currentPage = 1; renderContent(); }, PSUI.AUTOSAVE_DEBOUNCE_MS));
    document.getElementById('closeView').addEventListener('click', () => document.getElementById('viewDialog').close());
    document.getElementById('viewDialog').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

    window.addEventListener('load', async () => {
      const session = getStoredSession();
      const token   = getToken();

      if (!session || !token) {
        redirectLogin(null);
        return;
      }

      if (window.PSAccess && window.PSAccess.redirectIfForbidden(session, 'madingDigital.html')) return;

      window.PSShell.mount({
        currentPage: 'madingDigital.html',
        session,
        getStoredSession,
        storageKey: STORAGE.session
      });

      const descs = {
        santri:  'Mading, pengumuman, dan bacaan untuk santri.',
        pengurus:'Mading, pengumuman, dan informasi khusus pengurus.',
      };
      document.getElementById('pageDesc').textContent = descs[session.role] || 'Mading dan pengumuman pesantren.';

      try {
        const sessionData = await apiFetch('session', token);
        if (!sessionData.session) { redirectLogin(session.role); return; }
        saveSession(sessionData.session);
        currentRole = sessionData.session.role;

        if (currentRole === 'pengurus') {
          allItems = (await apiFetch('content.self.list', token)).items || [];
        } else if (currentRole === 'santri') {
          allItems = (await apiFetch('santri.self', token)).content || [];
        }
        renderContent();
      } catch (e) {
        if (e.code === 401) { redirectLogin(session.role); return; }
        document.getElementById('contentArea').innerHTML =
          `<p class="empty-state">Gagal memuat konten: ${e.message || 'Terjadi kesalahan.'}</p>`;
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
