                        ${entry.removedFromKelas ? `<span class="santri-removed-tag" title="Santri ini sudah dikeluarkan dari kelas, riwayat absensinya tetap ditampilkan dan bisa diedit.">Dikeluarkan dari kelas</span>` : ''}
                      </div>
                    </div>
                  </th>
                  ${state.modal.windowDates.map(dateValue => {
                    const dateEntry = entryMapsByDate[dateValue][entry.santriId] || {};
                    const status = dateEntry.status || '';
                    const locked = dateEntry.editable === false;
                    const conditions = matrixConditionInfos(dateEntry, dateValue);
                    const label = locked
                      ? `${entry.santriName || 'Santri'} sudah dikeluarkan dari kelas ini dan tidak punya riwayat absensi pada ${formatLongDate(dateValue)}.`
                      : conditions.length
                      ? `${entry.santriName || 'Santri'} ${getStatusLabel(status)} pada ${formatLongDate(dateValue)} — ${conditions.map(c => c.text).join(' · ')}`
                      : `${entry.santriName || 'Santri'} ${getStatusLabel(status)} pada ${formatLongDate(dateValue)}`;
                    return `
                      <td>
                        <div
                          class="matrix-cell ${dateValue === state.modal.selectedDate ? 'is-selected-date' : ''} ${locked ? 'is-locked-cell' : ''}"
                          data-matrix-cell="true"
                          data-date="${escapeHtml(dateValue)}"
                          data-santri-id="${escapeHtml(entry.santriId)}"
                          data-status-value="${escapeHtml(status)}"
                          title="${escapeHtml(label)}"
                          aria-label="${escapeHtml(label)}"
                          role="button"
                          tabindex="0"
                        >
                          <strong>${escapeHtml(locked ? '—' : getStatusShort(status))}</strong>
                          <span>${escapeHtml(locked ? 'Tidak diabsen' : getStatusLabel(status))}</span>
                          ${conditions.length ? `<span class="matrix-cell-condition-wrap" aria-hidden="true">${conditions.map(c => `<span class="matrix-cell-condition matrix-cell-condition-${c.type}">${escapeHtml(c.label)}</span>`).join('')}</span>` : ''}
                        </div>
                      </td>
                    `;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      const hint = document.getElementById('matrixLongPressHint');
      if (hint) {
        hint.hidden = false;
        clearTimeout(window._matrixHintTimer);
        window._matrixHintTimer = window.setTimeout(function() { hint.hidden = true; }, 5000);
      }
    }

    function renderEditorMeta() {
      const kelas = state.modal.kelas;
      const record = state.modal.record;
      const hasEntries = !!(record && Array.isArray(record.entries) && record.entries.length);
      document.getElementById('dialogTitle').textContent = kelas ? kelas.name : 'Memuat Kelas...';
      document.getElementById('attendanceDate').value = state.modal.windowEndDate || state.today;
      document.getElementById('attendanceWindowSize').value = String(state.modal.windowSize || 10);
      document.getElementById('setAllHadirButton').textContent = getBulkCycleButtonLabel();
      document.getElementById('setAllHadirButton').disabled = !hasEntries;
      document.getElementById('clearAllButton').disabled = !hasEntries;
      document.getElementById('copyLatestButton').disabled = !kelas || !(kelas.recentRecords || []).length;
      document.getElementById('undoButton').disabled = !state.modal.undoStack.length;
      document.getElementById('redoButton').disabled = !state.modal.redoStack.length;
      syncDirtyPill();
    }

    function renderDialog() {
      renderEditorMeta();
      renderAttendanceBody();
    }

    function markModalDirty(nextDirty) {
      state.modal.dirty = !!nextDirty;
      syncDirtyPill();
    }

    async function openAttendanceModal(kelasId, options = {}) {
      if (state.modal.open && !options.skipConfirm && !(await confirmSavePendingChanges())) {
        return;
      }

      const dialog = document.getElementById('attendanceDialog');
      if (!dialog.open) {
        dialog.showModal();
      }

      state.modal.open = true;
      state.modal.loading = true;
      state.modal.filter = '';
      markModalDirty(false);
      state.modal.kelas = getCardById(kelasId);
      state.modal.record = null;
      state.modal.selectedDate = options.selectedDate || options.date || '';
      state.modal.windowEndDate = options.date || '';
      state.modal.windowSize = normalizeWindowSize(options.windowSize || state.modal.windowSize);
      state.modal.windowDates = [];
      state.modal.recordsByDate = {};
      state.modal.originalRecordsByDate = {};
      state.modal.dirtyDates = [];
      state.modal.bulkSetIndex = 0;
      state.modal.undoStack = [];
      state.modal.redoStack = [];
      document.getElementById('santriSearchInput').value = '';
      renderDialog();

      const requestToken = state.modal.requestToken + 1;
      state.modal.requestToken = requestToken;

      try {
        const data = await api('kelas.absensi.get', {
          kelasId,
          tanggal: options.date || '',
          recordId: options.recordId || '',
          windowSize: state.modal.windowSize
        });
        if (state.modal.requestToken !== requestToken) return;

        state.modal.kelas = data.kelas || getCardById(kelasId);
        applyModalWindow(data, options);
        state.modal.loading = false;
        renderDialog();
        requestAnimationFrame(() => {
          const body = document.getElementById('attendanceBody');
          if (body) body.scrollLeft = options.scrollTo === 'start' ? 0 : body.scrollWidth;
        });
      } catch (error) {
        if (state.modal.requestToken !== requestToken) return;
        state.modal.loading = false;
        renderDialog();
        showNotice(error.message || 'Gagal membuka editor absensi Kelas.', 'error');
      }
    }

    async function closeAttendanceDialog(force) {
      const dialog = document.getElementById('attendanceDialog');
      if (!dialog.open) return;
      if (!force && !(await confirmSavePendingChanges())) return;
      dialog.close();
      resetModalState();
    }

    function getModalEntry(dateValue, santriId) {
      const record = getModalRecordByDate(dateValue);
      if (!record || !Array.isArray(record.entries)) return null;
      return record.entries.find(entry => entry.santriId === santriId) || null;
    }

    function selectModalDate(dateValue) {
      if (!dateValue || !getModalRecordByDate(dateValue)) return;
      state.modal.selectedDate = dateValue;
      syncSelectedModalRecord();
      renderDialog();
    }

    function setCellStatus(dateValue, santriId, status, options = {}) {
      const lockedEntry = getModalEntry(dateValue, santriId);
      if (lockedEntry && lockedEntry.editable === false) {
        if (state.modal.selectedDate !== dateValue) {
          state.modal.selectedDate = dateValue;
          syncSelectedModalRecord();
          renderDialog();
        }
        showNotice(`${lockedEntry.santriName || 'Santri'} sudah dikeluarkan dari kelas ini dan belum punya riwayat absensi pada tanggal ini.`, 'info');
        return;
      }
      commitModalMutation(() => {
        const entry = getModalEntry(dateValue, santriId);
        if (!entry) return false;
        const nextStatus = options.toggle && status && entry.status === status ? '' : (status || '');
        const selectedChanged = state.modal.selectedDate !== dateValue;
        state.modal.selectedDate = dateValue;
        syncSelectedModalRecord();
        if ((entry.status || '') === nextStatus) {
          return { changed: selectedChanged };
        }
        entry.status = nextStatus;
        recalculateRecordSummary(getModalRecordByDate(dateValue));
        return { changed: true };
      });
    }

    function applyCellStatus(dateValue, santriId, status) {
      setCellStatus(dateValue, santriId, status, { toggle: true });
    }

    function cycleCellStatus(dateValue, santriId) {
      const entry = getModalEntry(dateValue, santriId);
      if (!entry) return;
      setCellStatus(dateValue, santriId, getNextCycleStatus(entry.status || ''), { toggle: false });
    }

    function setColumnStatus(dateValue, status) {
      commitModalMutation(() => {
        const record = getModalRecordByDate(dateValue);
        if (!record || !Array.isArray(record.entries)) return false;
        const nextStatus = status || '';
        const selectedChanged = state.modal.selectedDate !== dateValue;
        let changed = false;
        state.modal.selectedDate = dateValue;
        syncSelectedModalRecord();
        record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(record);
        }
        return {
          changed: changed || selectedChanged,
          noticeText: changed ? `Kolom ${formatShortDate(dateValue)} diset ${getStatusLabel(nextStatus).toLowerCase()}.` : ''
        };
      });
    }

    function clearLongPressTimer() {
      if (state.modal.longPressTimer) {
        window.clearTimeout(state.modal.longPressTimer);
      }
      state.modal.longPressTimer = null;
    }

    function getLongPressDateFromEvent(event) {
      const cell = event.target.closest('[data-matrix-cell]');
      if (cell) return cell.getAttribute('data-date') || '';
      const dayButton = event.target.closest('[data-day-cell]');
      return dayButton ? (dayButton.getAttribute('data-select-date') || '') : '';
    }

    function startColumnLongPress(event) {
      const dateValue = getLongPressDateFromEvent(event);
      if (!dateValue) return;
      clearLongPressTimer();
      state.modal.longPressHandled = false;
      const targetButton = event.target.closest('button');
      if (targetButton) targetButton.classList.add('is-long-pressing');
      state.modal.longPressTimer = window.setTimeout(() => {
        state.modal.longPressTimer = null;
        state.modal.longPressHandled = true;
        if (targetButton) targetButton.classList.remove('is-long-pressing');
        setColumnStatus(dateValue, 'hadir');
      }, 650);
    }

    function stopColumnLongPress(event) {
      const targetButton = event && event.target ? event.target.closest('button') : null;
      if (targetButton) targetButton.classList.remove('is-long-pressing');
      clearLongPressTimer();
    }

    function setAllStatuses(status) {
      commitModalMutation(() => {
        if (!state.modal.record || !Array.isArray(state.modal.record.entries)) return false;
        const nextStatus = status || '';
        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(state.modal.record);
        }
        return { changed };
      });
    }

    function clearAllStatuses() {
      setAllStatuses('');
    }

    function cycleSetAllStatuses() {
      const previousIndex = normalizeBulkSetIndex(state.modal.bulkSetIndex);
      const targetStatus = getBulkCycleStatus(previousIndex);
      const nextIndex = normalizeBulkSetIndex(previousIndex + 1);
      commitModalMutation(() => {
        if (!state.modal.record || !Array.isArray(state.modal.record.entries)) return false;
        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          if ((entry.status || '') === targetStatus) {
            return;
          }
          entry.status = targetStatus;
          changed = true;
        });
        state.modal.bulkSetIndex = nextIndex;
        recalculateRecordSummary(state.modal.record);
        return { changed: changed || nextIndex !== previousIndex };
      });
    }

    function copyStatusesIntoSelectedRecord(sourceRecord, sourceDate) {
      if (!state.modal.record || !sourceRecord || !Array.isArray(sourceRecord.entries)) return;
      const copied = commitModalMutation(() => {
        const sourceMap = {};
        sourceRecord.entries.forEach(entry => {
          sourceMap[entry.santriId] = entry.status || '';
        });

        let changed = false;
        state.modal.record.entries.forEach(entry => {
          if (entry.editable === false) {
            return;
          }
          const nextStatus = sourceMap[entry.santriId] || '';
          if ((entry.status || '') === nextStatus) {
            return;
          }
          entry.status = nextStatus;
          changed = true;
        });
        if (changed) {
          recalculateRecordSummary(state.modal.record);
        }
        return {
          changed,
          noticeText: changed ? `Status dari ${formatShortDate(sourceDate)} berhasil disalin.` : ''
        };
      });

      if (copied) return;
      const sourceMap = {};
      sourceRecord.entries.forEach(entry => {
        sourceMap[entry.santriId] = entry.status || '';
      });
      const alreadySame = state.modal.record && Array.isArray(state.modal.record.entries) && state.modal.record.entries.every(entry => {
        return (entry.status || '') === (sourceMap[entry.santriId] || '');
      });
      if (alreadySame) {
        showNotice(`Status dari ${formatShortDate(sourceDate)} sudah sama.`);
      }
    }

    async function copyLatestStatuses() {
      const kelas = state.modal.kelas;
      const record = state.modal.record;
      if (!kelas || !record) return;

      const localSourceDate = state.modal.windowDates.slice().reverse().find(dateValue => {
        if (dateValue === record.tanggal) return false;
        const dateRecord = getModalRecordByDate(dateValue);
        return !!(dateRecord && dateRecord.exists);
      });
      if (localSourceDate) {
        copyStatusesIntoSelectedRecord(getModalRecordByDate(localSourceDate), localSourceDate);
        return;
      }

      const source = (kelas.recentRecords || []).find(item => item.tanggal !== record.tanggal) || kelas.recentRecords[0];
      if (!source) {
        showNotice('Belum ada riwayat yang bisa disalin untuk Kelas ini.', 'error');
        return;
      }

      try {
        const data = await api('kelas.absensi.get', { kelasId: kelas.id, recordId: source.id });
        copyStatusesIntoSelectedRecord(data.record, source.tanggal);
      } catch (error) {
        showNotice(error.message || 'Gagal menyalin status terakhir.', 'error');
      }
    }

    async function changeModalDate(nextDate, options = {}) {
      if (!state.modal.kelas) return;
      if (!nextDate) return;
      await openAttendanceModal(state.modal.kelas.id, {
        date: nextDate,
        windowSize: state.modal.windowSize,
        scrollTo: options.scrollTo
      });
    }

    async function changeModalWindowSize(nextSize) {
      if (!state.modal.kelas) return;
      const normalizedSize = normalizeWindowSize(nextSize);
      if (state.modal.dirty && !(await confirmSavePendingChanges())) {
        document.getElementById('attendanceWindowSize').value = String(state.modal.windowSize || 10);
        return;
      }
      await openAttendanceModal(state.modal.kelas.id, {
        date: state.modal.windowEndDate || state.today,
        selectedDate: state.modal.selectedDate,
        windowSize: normalizedSize,
        skipConfirm: true
      });
    }

    function shiftDate(days) {
      const input = document.getElementById('attendanceDate');
      const current = input.value || state.modal.windowEndDate || state.today;
      if (!current) return;
      changeModalDate(shiftDateValue(current, days), { scrollTo: days < 0 ? 'start' : 'end' });
    }

    async function saveModalChanges(options = {}) {
      if (!state.modal.kelas || !state.modal.windowDates.length) return false;
      if (!canManageAbsensiScoped()) { showNotice('Mudir hanya bisa melihat absensi kelas, tidak bisa menyimpan perubahan.', 'error'); return false; }
      if (!state.modal.dirtyDates.length) {
        if (!options.silentNoChanges) showNotice('Belum ada perubahan yang perlu disimpan.');
        return true;
      }

      const dirtyDates = state.modal.dirtyDates.slice();

      try {
        for (const dateValue of dirtyDates) {
          const record = getModalRecordByDate(dateValue);
          if (!record) continue;
          await api('kelas.absensi.save', {
            record: {
              id: record.id || '',
              tanggal: dateValue,
              kelasId: state.modal.kelas.id,
              catatan: record.catatan || '',
              entries: record.entries.map(entry => ({
                id_santri: entry.santriId,
                status: entry.status || '',
                keterangan: entry.keterangan || ''
              }))
            }
          }, 'POST');
        }
        await loadDashboardData(false);
        if (options.reload !== false) {
          await openAttendanceModal(state.modal.kelas.id, {
            date: state.modal.windowEndDate || state.today,
            selectedDate: state.modal.selectedDate,
            windowSize: state.modal.windowSize,
            skipConfirm: true
          });
        } else {
          dirtyDates.forEach(dateValue => {
            const record = getModalRecordByDate(dateValue);
            if (record) state.modal.originalRecordsByDate[dateValue] = clonePlain(record);
          });
          state.modal.dirtyDates = [];
          markModalDirty(false);
        }
        showNotice(dirtyDates.length === 1
          ? `Absensi Kelas berhasil disimpan untuk ${formatShortDate(dirtyDates[0])}.`
          : `Absensi Kelas berhasil disimpan untuk ${dirtyDates.length} hari.`);
        return true;
      } catch (error) {
        const message = `${error.message || 'Gagal menyimpan absensi Kelas.'}${dirtyDates.length > 1 ? ' Sebagian hari mungkin sudah tersimpan.' : ''}`;
        showNotice(message, 'error');
        return false;
      }
    }

    async function saveModal(event) {
      event.preventDefault();
      const btn = document.getElementById('saveDialogButton');
      if (btn) btn.disabled = true;
      try {
        await saveModalChanges({ reload: true });
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function openAbsensiRekapPanel() {
      const overlay = document.getElementById('absensiRekapOverlay');
      const body = document.getElementById('absensiRekapBody');
      const title = document.getElementById('absensiRekapTitle');

      const kelas = state.modal.kelas;
      const dates = state.modal.windowDates;

      let titleText = 'Rekap Sakit & Izin';
      if (kelas) titleText += ' — ' + kelas.name;
      if (dates.length >= 2) {
        titleText += ' (' + formatShortDate(dates[0]) + ' – ' + formatShortDate(dates[dates.length - 1]) + ')';
      } else if (dates.length === 1) {
        titleText += ' (' + formatShortDate(dates[0]) + ')';
      }
      title.textContent = titleText;

      const sakitByDate = {};
      const pulangByDate = {};

      dates.forEach(function(dateValue) {
        const record = getModalRecordByDate(dateValue);
        if (!record || !Array.isArray(record.entries)) return;
        record.entries.forEach(function(entry) {
          if (entry.sakit) {
            if (!sakitByDate[dateValue]) sakitByDate[dateValue] = [];
            const ket = entry.sakit.keterangan ? ' — ' + entry.sakit.keterangan : '';
            if (!entry.sakit.ongoing && entry.sakit.tanggalSembuh === dateValue) {
              const jam = entry.sakit.jamSembuh ? ' ' + entry.sakit.jamSembuh : '';
              sakitByDate[dateValue].push((entry.santriName || '-') + ' — Sembuh' + jam + ket);
            } else {
              const sampai = entry.sakit.tanggalSembuh ? ' s.d. ' + formatShortDate(entry.sakit.tanggalSembuh) + (entry.sakit.jamSembuh ? ' ' + entry.sakit.jamSembuh : '') : ' (belum sembuh)';
              const boleh = ' — ' + sakitBolehLabel(entry);
              sakitByDate[dateValue].push((entry.santriName || '-') + sampai + ket + boleh);
            }
          }
          if (entry.izin) {
            if (!pulangByDate[dateValue]) pulangByDate[dateValue] = [];
            const ket = entry.izin.keperluan ? ' — ' + entry.izin.keperluan : '';
            if (!entry.izin.ongoing && entry.izin.tanggalKembaliAktual === dateValue) {
              const jam = entry.izin.jamKembaliAktual ? ' ' + entry.izin.jamKembaliAktual : '';
              pulangByDate[dateValue].push((entry.santriName || '-') + ' — Sudah Kembali' + jam + ket);
            } else {
              const sampai = entry.izin.tanggalKembali ? ' s.d. ' + formatShortDate(entry.izin.tanggalKembali) + (entry.izin.jamKembali ? ' ' + entry.izin.jamKembali : '') : ' (belum kembali)';
              pulangByDate[dateValue].push((entry.santriName || '-') + sampai + ket);
            }
          }
        });
      });

      function buildCatHtml(catLabel, catClass, byDate) {
        const dateKeys = dates.filter(function(d) { return byDate[d] && byDate[d].length; });
        let html = '<div class="rekap-cat">';
        html += '<p class="rekap-cat-title ' + catClass + '">' + escapeHtml(catLabel) + '</p>';
        if (!dateKeys.length) {
          html += '<p class="rekap-empty">Tidak ada</p>';
        } else {
          dateKeys.forEach(function(dateValue) {
            html += '<div class="rekap-date-row">';
            html += '<span class="rekap-date-label">' + escapeHtml(formatShortDate(dateValue)) + '</span>';
            html += '<span class="rekap-names">' + byDate[dateValue].map(escapeHtml).join(' &middot; ') + '</span>';
            html += '</div>';
          });
        }
        html += '</div>';
        return html;
      }

      body.innerHTML =
        buildCatHtml('Sakit', 'sakit', sakitByDate) +
        buildCatHtml('Izin Pulang', 'pulang', pulangByDate);

      overlay.hidden = false;
    }

    function closeAbsensiRekapPanel() {
      document.getElementById('absensiRekapOverlay').hidden = true;
    }

    let _silabusItems = [];

    async function openSilabusPanel() {
      const kelas = state.modal.kelas;
      if (!kelas) return;
      document.getElementById('silabusTitle').textContent = 'Silabus' + (kelas.name ? ' — ' + kelas.name : '');
      const body = document.getElementById('silabusBody');
      body.innerHTML = '<p class="rekap-empty">Memuat...</p>';
      document.getElementById('silabusOverlay').hidden = false;
      try {
        const data = await api('kelas.silabus.list', { kelas_id: kelas.id });
        _silabusItems = data.items || [];
        renderSilabusPanelBody();
      } catch (e) {
        body.innerHTML = '<p class="rekap-empty">Gagal memuat silabus: ' + escapeHtml(e.message) + '</p>';
      }
    }

    function renderSilabusPanelBody() {
      const body = document.getElementById('silabusBody');
      if (!_silabusItems.length) {
        body.innerHTML = '<p class="rekap-empty">Belum ada materi silabus untuk kelas ini. Tambahkan lewat halaman Edit Kelas.</p>';
        return;
      }
      const done = _silabusItems.filter(it => it.selesai).length;
      const progress = `<p class="silabus-progress">${done}/${_silabusItems.length} materi selesai</p>`;
      const today = new Date().toISOString().slice(0, 10);
      const rows = _silabusItems.map(it => {
        const overdue = it.deadline && !it.selesai && it.deadline < today;
        return `
        <div class="silabus-item-row${it.selesai ? ' is-done' : ''}">
          <input type="checkbox" data-silabus-check="${it.id}" ${it.selesai ? 'checked' : ''}>
          <span class="silabus-item-name">${escapeHtml(it.nama_materi)}</span>
          ${it.tanggal_selesai ? `<span class="silabus-item-date">${escapeHtml(it.tanggal_selesai)}</span>` : ''}
          ${it.deadline ? `<span class="silabus-item-date" style="${overdue ? 'color:var(--danger,#a55);font-weight:600;' : ''}">${overdue ? '⚠ ' : ''}Batas: ${escapeHtml(it.deadline)}</span>` : ''}
        </div>
      `;
      }).join('');
      body.innerHTML = progress + rows;
    }

    async function toggleSilabusItem(id, cb) {
      if (cb) cb.disabled = true;
      try {
        await api('kelas.silabus.toggle', { id }, 'POST');
        const kelas = state.modal.kelas;
        const data = await api('kelas.silabus.list', { kelas_id: kelas.id });
        _silabusItems = data.items || [];
        renderSilabusPanelBody();
      } catch (e) {
        showNotice(e.message || 'Gagal mengubah status materi.', 'error');
        if (cb) cb.disabled = false;
      }
    }

    function closeSilabusPanel() {
      document.getElementById('silabusOverlay').hidden = true;
    }

    function applyHideSantriNamePref(hide) {
      document.getElementById('attendanceBody').classList.toggle('hide-name-col', hide);
      document.getElementById('toggleNamaButton').textContent = hide ? 'Tampilkan Nama' : 'Sembunyikan Nama';
      localStorage.setItem(STORAGE.hideSantriName, hide ? '1' : '0');
    }

    function bindEvents() {
      document.getElementById('searchInput').addEventListener('input', PSUI.debounce(event => {
        state.searchQuery = event.target.value || '';
        state.page = 1;
        renderCards();
      }, PSUI.AUTOSAVE_DEBOUNCE_MS));
      document.getElementById('filterGender').addEventListener('change', event => {
        state.filterGender = event.target.value || '';
        state.page = 1;
        renderCards();
      });
      document.addEventListener('click', e => {
        const btn = e.target.closest('[data-page]');
        if (!btn) return;
        const top = document.getElementById('paginationTop');
        const bot = document.getElementById('paginationBottom');
        if (!top?.contains(btn) && !bot?.contains(btn)) return;
        const total = getFilteredItems().length;
        const totalPages = Math.ceil(total / state.pageSize);
        const p = parseInt(btn.dataset.page, 10);
        if (p >= 1 && p <= totalPages) { state.page = p; renderCards(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });

      document.getElementById('refreshButton').addEventListener('click', async () => {
        try {
          await loadDashboardData(true);
        } catch (error) {
          showNotice(error.message || 'Gagal memuat ulang data.', 'error');
        }
      });

      document.getElementById('kelasList').addEventListener('click', event => {
        const trigger = event.target.closest('[data-open-kelas]');
        if (!trigger) return;
        openAttendanceModal(trigger.getAttribute('data-open-kelas'), {
          recordId: trigger.getAttribute('data-record-id') || '',
          date: trigger.getAttribute('data-date') || state.today
        });
      });

      document.getElementById('attendanceDialog').addEventListener('cancel', async event => {
        if (state.modal.dirty) {
          event.preventDefault();
          if (await confirmSavePendingChanges()) {
            document.getElementById('attendanceDialog').close();
            resetModalState();
          }
        } else {
          resetModalState();
        }
      });

      // Safety net: 'close' native event selalu fires apa pun cara dialog ditutup
      // (dialog.close(), Esc, form method="dialog") -- pastikan notice balik ke <body>.
      document.getElementById('attendanceDialog').addEventListener('close', () => {
        relocateNoticeStack();
      });

      document.getElementById('attendanceDialog').addEventListener('click', async event => {
        if (!event.target.closest || !event.target.closest('.ps-dialog-close-floating')) return;
        event.preventDefault();
        event.stopPropagation();
        await closeAttendanceDialog(false);
      }, true);
      document.getElementById('cancelDialogButton').addEventListener('click', () => {
        closeAttendanceDialog(false);
      });
      document.getElementById('attendanceForm').addEventListener('submit', saveModal);

      document.getElementById('attendanceDate').addEventListener('change', event => {
        changeModalDate(event.target.value);
      });
      document.getElementById('attendanceWindowSize').addEventListener('change', event => {
        changeModalWindowSize(event.target.value);
      });
      document.getElementById('prevDateButton').addEventListener('click', () => shiftDate(-1));
      document.getElementById('nextDateButton').addEventListener('click', () => shiftDate(1));
      document.getElementById('santriSearchInput').addEventListener('input', PSUI.debounce(event => {
        state.modal.filter = event.target.value || '';
        renderAttendanceBody();
      }, PSUI.AUTOSAVE_DEBOUNCE_MS));
      applyHideSantriNamePref(localStorage.getItem(STORAGE.hideSantriName) === '1');
      document.getElementById('toggleNamaButton').addEventListener('click', () => {
        applyHideSantriNamePref(!document.getElementById('attendanceBody').classList.contains('hide-name-col'));
      });
      document.getElementById('setAllHadirButton').addEventListener('click', cycleSetAllStatuses);
      document.getElementById('clearAllButton').addEventListener('click', clearAllStatuses);
      document.getElementById('copyLatestButton').addEventListener('click', copyLatestStatuses);
      document.getElementById('undoButton').addEventListener('click', undoModalChange);
      document.getElementById('redoButton').addEventListener('click', redoModalChange);
      document.getElementById('rekapAbsensiButton').addEventListener('click', openAbsensiRekapPanel);
      document.getElementById('closeAbsensiRekapButton').addEventListener('click', closeAbsensiRekapPanel);
      document.getElementById('absensiRekapOverlay').addEventListener('click', function(event) {
        if (event.target === document.getElementById('absensiRekapOverlay')) closeAbsensiRekapPanel();
      });
      document.getElementById('silabusButton').addEventListener('click', openSilabusPanel);
      document.getElementById('closeSilabusButton').addEventListener('click', closeSilabusPanel);
      document.getElementById('silabusOverlay').addEventListener('click', function(event) {
        if (event.target === document.getElementById('silabusOverlay')) closeSilabusPanel();
      });
      document.getElementById('silabusBody').addEventListener('change', function(event) {
        const cb = event.target.closest('[data-silabus-check]');
        if (cb) toggleSilabusItem(cb.getAttribute('data-silabus-check'), cb);
      });

      document.getElementById('attendanceBody').addEventListener('click', event => {
        if (state.modal.longPressHandled) {
          state.modal.longPressHandled = false;
          event.preventDefault();
          return;
        }
        const nameToggle = event.target.closest('.matrix-name-cell, .matrix-name-head');
        if (nameToggle) {
          const table = nameToggle.closest('.attendance-matrix');
          if (table) table.classList.toggle('name-col-narrow');
          return;
        }
        const dateButton = event.target.closest('[data-select-date]');
        if (dateButton) {
          selectModalDate(dateButton.getAttribute('data-select-date'));
          return;
        }
        const matrixCell = event.target.closest('[data-matrix-cell]');
        if (matrixCell) {
          const dateValue = matrixCell.getAttribute('data-date');
          const santriId = matrixCell.getAttribute('data-santri-id');
          cycleCellStatus(dateValue, santriId);
        }
      });

      document.getElementById('attendanceBody').addEventListener('pointerdown', startColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointerup', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointerleave', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('pointercancel', stopColumnLongPress);
      document.getElementById('attendanceBody').addEventListener('contextmenu', event => {
        if (event.target.closest('[data-matrix-cell], [data-day-cell]')) {
          event.preventDefault();
        }
      });

      document.getElementById('attendanceBody').addEventListener('keydown', event => {
        const key = String(event.key || '').toLowerCase();
        const isActivateKey = key === 'enter' || key === ' ';

        const matrixCell = event.target.closest('[data-matrix-cell]');
        if (matrixCell) {
          const santriId = matrixCell.getAttribute('data-santri-id');
          const dateValue = matrixCell.getAttribute('data-date');
          if (isActivateKey) {
            event.preventDefault();
            cycleCellStatus(dateValue, santriId);
            return;
          }
          if (key === 'h') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'hadir');
            return;
          }
          if (key === 'i') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'izin');
            return;
          }
          if (key === 's') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'sakit');
            return;
          }
          if (key === 'a') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'alfa');
            return;
          }
          if (key === 't') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'tugas');
            return;
          }
          if (key === 'n') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, 'hari_tidak_aktif');
            return;
          }
          if (key === 'delete' || key === 'backspace' || key === 'x') {
            event.preventDefault();
            applyCellStatus(dateValue, santriId, '');
          }
          return;
        }

        // matrix-day-btn & matrix-name-cell dulu <button> asli (Enter/Space aktivasi otomatis
        // dari browser) -- sekarang div biasa demi performa render, jadi aktivasi keyboard-nya
        // perlu ditangani manual di sini supaya tetap bisa dipakai tanpa mouse.
        if (!isActivateKey) return;
        const nameToggle = event.target.closest('.matrix-name-cell, .matrix-name-head');
        if (nameToggle) {
          event.preventDefault();
          const table = nameToggle.closest('.attendance-matrix');
          if (table) table.classList.toggle('name-col-narrow');
          return;
        }
        const dateButton = event.target.closest('[data-select-date]');
        if (dateButton) {
          event.preventDefault();
          selectModalDate(dateButton.getAttribute('data-select-date'));
        }
      });
    }

    const session = getStoredSession();
    if (!session) {
      clearSession();
      window.location.replace('/pages/login/');
    } else if (window.PSAccess && !window.PSAccess.canAccessPage(session, '/pages/kelasAbsensi/')) {
      window.location.replace('/pages/accountProfile/');
    } else {
      state.session = session;
      state.today = todayDate();
      mountShell(session);
      bindEvents();
      window.addEventListener('load', async () => {
        try {
          await loadTahunSelect();
          await loadDashboardData(false);
          const openKelasId = new URLSearchParams(location.search).get('openKelas');
          if (openKelasId) {
            history.replaceState(null, '', location.pathname);
            await openAttendanceModal(openKelasId);
          }
        } catch (error) {
          showNotice(error.message || 'Gagal memuat halaman absensi Kelas.', 'error');
        }
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
