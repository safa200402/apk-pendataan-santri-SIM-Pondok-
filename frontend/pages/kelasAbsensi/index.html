<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8e4b2d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../../shared-ui.css">
  <script src="../../shared-ui.js"></script>
  <title>Absensi Kelas</title>
  <link rel="stylesheet" href="../../shared-shell.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #f6efe5;
      --bg-soft: #fff8ef;
      --paper: rgba(255, 251, 244, 0.92);
      --line: rgba(97, 66, 46, 0.14);
      --ink: #3f2b1f;
      --muted: #7d6858;
      --accent: #a85b32;
      --accent-soft: rgba(168, 91, 50, 0.12);
      --success: #4e7a55;
      --success-soft: #68ff80;
      --warning: #9f7600;
      --warning-soft: rgb(255, 210, 76);
      --danger: #b25b4d;
      --danger-soft: rgb(255, 167, 153);
      --sick: #c4661f;
      --sick-soft: rgb(255, 132, 37);
      --alpha: #b23d3d;
      --alpha-soft: rgb(255, 67, 67);
      --info: #4b6f9f;
      --info-soft: rgb(70, 150, 255);
      --inactive-day: #596779;
      --inactive-day-soft: rgb(172, 185, 204);
      --shadow: 0 22px 48px rgba(87, 60, 40, 0.14);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --status-empty: #a39a8f;
      --status-empty-soft: rgba(163, 154, 143, 0.16);
    }

    * { box-sizing: border-box; }
    button { font-weight: 800 !important; text-transform: uppercase; }
    table button { font-weight: revert; text-transform: none; }

    html, body { margin: 0; min-height: 100%; }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    .panel {
      position: relative;
      padding: 22px;
      overflow: hidden;
    }

    .panel::after {
      content: '';
      position: absolute;
      inset: auto -10% -60% auto;
      width: 240px;
      height: 240px;
      pointer-events: none;
    }

    h1, h2, h3 {
      margin: 0;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    p { margin: 0; line-height: 1.6; }

    button, input, textarea {
      font: inherit;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .summary-pill, .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .toolbar {
      gap: 12px;
      width: 100%;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 8px;
      /* padding: 8px; */
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
    }

    .toolbar button {
      flex: 1 0 160px;
      height: 44px;
      border: none;
      border-radius: 8px;
      background-color: #ffffff;
      color: #222;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 5px;
    }

    .toolbar + .section-head {
      margin-top: 18px;
    }

    #rekapAbsensiButton {
      background: var(--sick-soft);
      color: var(--ink);
    }
    #rekapAbsensiButton:hover {
      background: var(--sick);
      color: #fff;
    }

    #silabusButton {
      background: var(--info-soft);
      color: var(--ink);
    }
    #silabusButton:hover {
      background: var(--info);
      color: var(--ink);
    }

    .btn, .search-field {
      min-height: 48px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(84, 58, 40, 0.08);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      /* box-shadow: none; */
    }

    #refreshButton {
      max-width: 21vh;
      margin: 5px;
    }

    .search-field {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      flex: 1 !important;
      border: 1px solid rgba(94, 68, 49, 0.13);
      border-radius: 999px;
      background:
        linear-gradient(135deg, rgba(255, 253, 248, 0.95), rgba(247, 229, 176, 0.62)),
        rgba(255, 250, 238, 0.92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62), 0 12px 24px rgba(84, 58, 40, 0.08);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .search-field:focus-within {
      border-color: rgba(51, 51, 51, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), 0 0 0 4px rgba(51, 51, 51, 0.08), 0 16px 28px rgba(84, 58, 40, 0.12);
      transform: translateY(-1px);
    }

    .search-field span {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      color: rgba(41, 23, 15, 0.72);
    }

    .search-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font: inherit;
      color: #29170f;
    }

    .search-field input::placeholder {
      color: rgba(41, 23, 15, 0.42);
      font-weight: 700;
    }

    .santri-search-field {
      flex: 1 1 260px;
      max-width: 420px;
      min-width: min(100%, 240px);
      background:
        linear-gradient(135deg, rgba(255, 254, 250, 0.98), rgba(255, 232, 158, 0.54)),
        #fffaf0;
    }

    .santri-search-field::before {
      content: '';
      width: 12px;
      height: 12px;
      border: 2px solid rgba(51, 51, 51, 0.62);
      border-radius: 999px;
      box-shadow: 6px 6px 0 -4px rgba(51, 51, 51, 0.62);
      flex: 0 0 auto;
    }

    .unsaved-confirm {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(35, 24, 15, 0.46);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .unsaved-confirm.show {
      opacity: 1;
      pointer-events: auto;
    }

    .unsaved-confirm[hidden] {
      display: none;
    }

    .unsaved-card {
      width: min(420px, 100%);
      padding: 22px;
      border: 1px solid rgba(94, 68, 49, 0.14);
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255, 253, 247, 0.98), rgba(247, 226, 156, 0.9)),
        #fff8e6;
      box-shadow: 0 24px 70px rgba(33, 23, 14, 0.28);
    }

    .unsaved-card h3 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      color: #29170f;
    }

    .unsaved-card p {
      margin: 0;
      color: rgba(41, 23, 15, 0.72);
      font-weight: 700;
    }

    .unsaved-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }

    .section-head h2 {
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }

    .kelas-grid {
      display: grid;
      /* grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); */
      gap: 14px;
    }

    .attendance-alert {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      border-top: 1px dashed rgba(75, 44, 32, 0.18);
      color: #4a4a4a;
    }

    .attendance-alert.pending {
      color: var(--warning);
    }

    .attendance-alert.partial {
      color: #ff2200;
    }

    .attendance-audit {
      padding: 0 16px 10px;
      margin-top: -6px;
      font-size: 11.5px;
      color: var(--warning, #9f7600);
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.5;
    }
    .attendance-audit i { margin-top: 2px; flex-shrink: 0; }

    .status-pill.hadir, .summary-pill.hadir {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-pill.izin, .summary-pill.izin {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-pill.sakit, .summary-pill.sakit {
      background: var(--sick-soft);
      color: var(--sick);
    }

    .status-pill.alfa, .summary-pill.alfa {
      background: var(--alpha-soft);
      color: var(--alpha);
    }

    .status-pill.tugas, .summary-pill.tugas {
      background: var(--info-soft);
      color: var(--info);
    }

    .status-pill.hari_tidak_aktif, .summary-pill.hari_tidak_aktif {
      background: var(--inactive-day-soft);
      color: var(--inactive-day);
    }

    .status-pill.empty, .summary-pill.empty {
      background: var(--status-empty-soft);
      color: var(--status-empty);
    }

    .empty-state {
      padding: 28px;
      text-align: center;
    }

    .notice {
      padding: 14px 16px;
      line-height: 1.55;
    }

    .notice.show { display: block; }

    #attendanceDialog {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      margin: 0;
      border: 0;
      padding: 0;
      border-radius: 0;
      background:
        linear-gradient(180deg, rgba(126, 91, 22, 0.18), rgba(79, 55, 16, 0.12)),
        rgba(255, 240, 191, 0.08);
      box-shadow: 0 34px 90px rgba(42, 28, 16, 0.34);
      backdrop-filter: blur(12px);
    }

    #attendanceDialog::backdrop {
      background: rgba(37, 23, 15, 0.48);
      backdrop-filter: blur(6px);
    }

    .attendance-shell {
        height: 100%;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        /* gap: 14px; */
        padding: 18px;
        background: #f3e7c0;
        backdrop-filter: blur(18px);
    }

    .attendance-main {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }

    .attendance-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      background:
        linear-gradient(135deg, rgba(255, 251, 238, 0.84), rgba(235, 210, 134, 0.56)),
        rgba(255, 250, 235, 0.7);
    }

    .attendance-head h2 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: #29170f;
    }

    .attendance-toolbar {
      display: grid;
      gap: 14px;
      margin-top: 10px;
    }

    .attendance-content {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border-radius: 25px;
    }

    .matrix-longpress-hint {
      background: rgba(168,91,50,0.09);
      border-bottom: 1px solid rgba(168,91,50,0.15);
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      animation: fade-in-hint 0.3s ease;
    }
    @keyframes fade-in-hint { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .date-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
    }

    .date-control {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 14px;
      min-height: 52px;
    }

    .date-control strong {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .date-control .btn {
      min-height: 42px;
      padding: 0 14px;
    }

    .date-control input,
    .date-control select {
      min-height: 42px;
      padding: 0 10px;
    }

    .date-control input,
    .date-control select {
      outline: none;
    }

    .date-control select {
      min-width: 82px;
      cursor: pointer;
      font-weight: 800;
    }

    .attendance-body {
      min-height: 0;
      overflow: auto;
      /* padding: 16px; */
      border: 1px solid rgba(94, 68, 49, 0.12);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 253, 247, 0.72), rgba(250, 240, 207, 0.42)),
        rgba(255, 251, 244, 0.76);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .attendance-matrix-wrap {
      min-width: max-content;
    }

    .attendance-matrix {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      /* border-spacing: 10px; */
      border-spacing: 0;
    }

    .attendance-matrix th,
    .attendance-matrix td {
      padding: 0;
      vertical-align: top;
      border: 1px solid rgb(0, 0, 0);
    }

    .attendance-matrix thead th {
      position: sticky;
      top: 0;
      z-index: 6;
      background: rgba(255, 245, 213, 0.96);
      backdrop-filter: blur(8px);
    }

    .attendance-matrix .sticky-col {
      position: sticky;
      left: 0;
      z-index: 3;
      background: rgba(255, 250, 238, 0.96);
      box-shadow: 14px 0 26px rgba(84, 58, 40, 0.06);
      border: 1px solid black;
      background-color: #c99a28;
    }

    .attendance-matrix thead .sticky-col {
      z-index: 8;
      min-height: 84px;
      background-color: #333;
    }

    .matrix-name-head,
    .matrix-name-cell {
      /* min-width: 280px; */
      /* max-width: 320px; */
      /* border-radius: 20px; */
      border: 0px solid rgba(94, 68, 49, -0.88);
      padding: 16px 18px;
      /* width: 100%; */
      border-style: solid !important;
      border-color: #4b2c20 !important;
      border-radius: 0px !important;
      /* box-shadow: 0px 0px 0 #4b2c20 !important;    
      border-width: 0px !important;     */
      height: 105px;
      box-shadow: 0px 0px 0 #4b2c20 !important;
      border-width: 0px !important;
    }

    .matrix-name-head {
      display: grid;
      gap: 6px;
      text-align: left;
      min-height: 84px;
      align-items: center;
    }

    .matrix-name-head strong {
      font-size: 0.95rem;
    }

    .matrix-name-head small {
      font-size: 0.78rem;
    }

    .santri-identity {
      display: grid;
      gap: 4px;
    }

    .santri-name {
      font-size: 1.02rem;
      white-space: pre;
      overflow: auto;
      width: 165px;
    }

    .santri-meta {
      color: var(--muted);
      font-size: 0.92rem;
      white-space: pre;
      overflow: auto;
      width: 165px;
    }

    .santri-removed-tag {
      display: inline-block;
      margin-top: 2px;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      background: rgba(165, 90, 82, 0.16);
      color: #a55a52;
      width: fit-content;
    }

    .attendance-body.hide-name-col .sticky-col {
      display: none;
    }

    .matrix-day-btn,
    .matrix-cell {
      width: 100%;
      height: 105px;
      /* min-height: 72px; */
      /* border-radius: 18px; */
      border: 0px solid rgba(94, 68, 49, 0.12);
      background: rgba(255, 252, 246, 0.95);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      gap: 4px;
      padding: 0px;
      font-weight: 800;
      touch-action: manipulation;
      user-select: none;
      border-radius: 0px !important;
      border-width: 0px !important;
      box-shadow: 0px 0px 0 #4b2c20 !important;
      position: relative;
      text-wrap: wrap;
    }

    .matrix-cell-condition-wrap {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      pointer-events: none;
    }
    .matrix-cell-condition {
      font-size: 8px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 5px;
      max-width: 96px;
      text-align: right;
      text-wrap: wrap;
    }
    .matrix-cell-condition-sakit { background: rgba(165, 90, 82, 0.18); color: #a55a52; }
    .matrix-cell-condition-izin { background: rgba(84, 113, 167, 0.2); color: #4a6da3; }
    .matrix-cell-condition-sembuh { background: rgba(116, 132, 108, 0.42); color: #4a6040; }
    .matrix-cell-condition-kembali { background: rgba(116, 132, 108, 0.42); color: #4a6040; }

    .matrix-day-btn {
      min-height: 84px;
      background: rgba(255, 249, 236, 0.96);
      padding: 16px 18px;
      /* width: 100%; */
      border-style: solid !important;
      border-color: #4b2c20 !important;
      border-radius: 0px !important;
      box-shadow: 0px 0px 0 #4b2c20 !important;    
      border-width: 0px !important;    
    }

    /* .matrix-cell:hover {
      background: none !important;
    
    } */

    .matrix-day-btn span,
    .matrix-cell span {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .matrix-day-btn strong {
      font-size: 0.95rem;
    }

    .matrix-day-btn small {
      font-size: 11px;
    }

    .matrix-day-btn.selected {
      /* border-style: dotted; */
      background: linear-gradient(180deg, rgba(255, 239, 184, 0.98), rgba(255, 212, 107, 0.72));
    }

    .matrix-cell:focus-visible,
    .matrix-day-btn:focus-visible,
    .matrix-name-cell:focus-visible {
      outline: 2px solid rgba(168, 91, 50, 0.38);
      outline-offset: 3px;
    }

    .matrix-name-head { cursor: pointer; }
    .attendance-matrix.name-col-narrow .sticky-col {
      width: 15vh;
      max-width: 15vh;
      overflow: hidden;
    }
    .attendance-matrix.name-col-narrow .matrix-name-head,
    .attendance-matrix.name-col-narrow .matrix-name-cell {
      width: 15vh;
      max-width: 15vh;
      overflow: hidden;
      white-space: nowrap;
    }

    /* .matrix-cell.is-selected-date {
      border-style: dotted;
    } */

    .matrix-cell[data-status-value="hadir"] {
      background: var(--success-soft);
      color: var(--success);
      /* border-color: rgba(78, 122, 85, 0.26); */
    }

    .matrix-cell[data-status-value="izin"] {
      background: var(--warning-soft);
      color: var(--warning);
      /* border-color: rgba(177, 118, 43, 0.26); */
    }

    .matrix-cell[data-status-value="sakit"] {
      background: var(--sick-soft);
      color: var(--sick);
      /* border-color: rgba(128, 109, 53, 0.28); */
    }

    .matrix-cell[data-status-value="alfa"] {
      background: var(--alpha-soft);
      color: var(--alpha);
      /* border-color: rgba(178, 61, 61, 0.28); */
    }

    .matrix-cell[data-status-value="tugas"] {
      background: var(--info-soft);
      color: var(--info);
      /* border-color: rgba(75, 111, 159, 0.26); */
    }

    .matrix-cell[data-status-value="hari_tidak_aktif"] {
      background: var(--inactive-day-soft);
      color: var(--inactive-day);
    }

    .matrix-cell.is-long-pressing,
    .matrix-day-btn.is-long-pressing {
      box-shadow: inset 0 0 0 2px rgba(78, 122, 85, 0.3), 0 10px 22px rgba(78, 122, 85, 0.12);
      /* border-color: rgba(78, 122, 85, 0.34); */
    }

    .matrix-cell[data-status-value=""] {
      color: var(--status-empty);
      background: rgba(255, 252, 246, 0.95);
    }

    .matrix-cell.is-locked-cell {
      cursor: not-allowed;
      opacity: 0.5;
      background: repeating-linear-gradient(
        45deg,
        rgba(94, 68, 49, 0.05),
        rgba(94, 68, 49, 0.05) 6px,
        rgba(94, 68, 49, 0.1) 6px,
        rgba(94, 68, 49, 0.1) 12px
      ) !important;
    }

    .attendance-foot {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      background:
        linear-gradient(135deg, rgba(255, 251, 239, 0.84), rgba(232, 205, 122, 0.56)),
        rgba(255, 249, 240, 0.85);
    }

    .attendance-foot .attendance-toolbar {
      padding: 0;
      border: 0;
      box-shadow: none;
      background: transparent;
    }

    .loading-state, .modal-empty {
      min-height: 260px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

    .sr-only {
      position: absolute;
      width: 1px;

<body>

  <script src="../../shared-access.js"></script>
  <script src="../../shared-nav.js"></script>
  <script src="../../shared-shell.js"></script>
  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = { apiBase: 'ps_api_base', token: 'ps_token', session: 'ps_session', hideSantriName: 'ps_kelas_absensi_hide_nama' };
    const DATE_FORMATTER = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Asia/Jakarta' });
    const SHORT_DATE_FORMATTER = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Jakarta' });
    const WEEKDAY_FORMATTER = new Intl.DateTimeFormat('id-ID', { weekday: 'short', timeZone: 'Asia/Jakarta' });
    const STATUS_OPTIONS = [
      { value: 'hari_tidak_aktif', short: 'NA', label: 'Hari tidak aktif' },
      { value: 'hadir', short: 'H', label: 'Hadir' },
      { value: 'izin', short: 'I', label: 'Izin' },
      { value: 'sakit', short: 'S', label: 'Sakit' },
      { value: 'alfa', short: 'A', label: 'Alfa' },
      { value: 'tugas', short: 'T', label: 'Tugas' }
    ];
    const STATUS_SEQUENCE = STATUS_OPTIONS.map(item => item.value);
    const WINDOW_SIZE_OPTIONS = [7, 10, 15, 30, 60, 90];
    const MODAL_HISTORY_LIMIT = 100;
    const state = {
      session: null,
      today: '',
      searchQuery: '',
      filterGender: '',
      page: 1,
      pageSize: 10,
      items: [],
      tahunList: [],
      selectedTahun: '',
      modal: {
        open: false,
        loading: false,
        dirty: false,
        requestToken: 0,
        filter: '',
        kelas: null,
        record: null,
        selectedDate: '',
        windowEndDate: '',
        windowSize: 10,
        windowDates: [],
        recordsByDate: {},
        originalRecordsByDate: {},
        dirtyDates: [],
        bulkSetIndex: 0,
        undoStack: [],
        redoStack: [],
        clickTimers: {},
        longPressTimer: null,
        longPressHandled: false
      }
    };
    let noticeId = '';
    let noticeCounter = 0;
    let pendingUnsavedPrompt = null;

    localStorage.setItem(STORAGE.apiBase, API_BASE);

    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getToken() {
      return localStorage.getItem(STORAGE.token) || '';
    }

    function clearSession() {
      localStorage.removeItem(STORAGE.token);
      localStorage.removeItem(STORAGE.session);
    }

    function getStoredSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE.session) || 'null');
      } catch (error) {
        return null;
      }
    }

    function canManageAbsensiScoped() {
      const session = window.PSAccess && typeof window.PSAccess.getScopedSession === 'function'
        ? window.PSAccess.getScopedSession(getStoredSession())
        : getStoredSession();
      const p = session && session.permissions;
      return !!(p && (p.canManageKelasSiang || p.canManageNilaiUp));
    }

    function todayDate() {
      return new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(new Date());
    }

    function formatLongDate(value) {
      if (!value) return '-';
      return DATE_FORMATTER.format(new Date(`${value}T12:00:00`));
    }

    function formatShortDate(value) {
      if (!value) return '-';
      return SHORT_DATE_FORMATTER.format(new Date(`${value}T12:00:00`));
    }

    function formatWeekday(value) {
      if (!value) return '-';
      return WEEKDAY_FORMATTER.format(new Date(`${value}T12:00:00`));
    }

    function shiftDateValue(value, days) {
      if (!value) return '';
      const base = new Date(`${value}T12:00:00`);
      base.setDate(base.getDate() + days);
      return new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).format(base);
    }

    function clonePlain(value) {
      return value == null ? value : JSON.parse(JSON.stringify(value));
    }

    function getStatusMeta(status) {
      return STATUS_OPTIONS.find(item => item.value === status) || null;
    }

    function getStatusShort(status) {
      const item = getStatusMeta(status);
      return item ? item.short : '-';
    }

    function getStatusLabel(status) {
      const item = getStatusMeta(status);
      return item ? item.label : 'Belum diisi';
    }

    function getNextCycleStatus(status) {
      if (!status) return STATUS_SEQUENCE[0];
      const index = STATUS_SEQUENCE.indexOf(status);
      if (index === -1) return STATUS_SEQUENCE[0];
      return index >= STATUS_SEQUENCE.length - 1 ? '' : STATUS_SEQUENCE[index + 1];
    }

    function normalizeBulkSetIndex(value) {
      if (!STATUS_SEQUENCE.length) return 0;
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return 0;
      return ((Math.trunc(parsed) % STATUS_SEQUENCE.length) + STATUS_SEQUENCE.length) % STATUS_SEQUENCE.length;
    }

    function getBulkCycleStatus(index = state.modal.bulkSetIndex) {
      return STATUS_SEQUENCE[normalizeBulkSetIndex(index)] || STATUS_SEQUENCE[0] || '';
    }

    function getBulkCycleButtonLabel() {
      const meta = getStatusMeta(getBulkCycleStatus());
      return meta ? `Set semua ${meta.label.toLowerCase()}` : 'Set semua status';
    }

    function normalizeWindowSize(value) {
      const parsed = Number(value);
      return WINDOW_SIZE_OPTIONS.includes(parsed) ? parsed : 10;
    }

    function toParams(data) {
      const params = new URLSearchParams();
      Object.entries(data || {}).forEach(([key, value]) => {
        if (value === undefined || value === null) return;
        params.append(key, typeof value === 'object' ? JSON.stringify(value) : String(value));
      });
      return params;
    }

    async function api(action, payload = {}, method = 'GET') {
      const token = getToken();
      if (!token) {
        clearSession();
        window.location.replace('/pages/login/');
        throw new Error('Sesi tidak ditemukan.');
      }

      const scopeLabel = window.PSAccess ? (window.PSAccess.getActiveRoleScopeLabel(getStoredSession()) || '') : '';
      const response = method === 'GET'
        ? await fetch(`${API_BASE}?${toParams({ action, token, scopeLabel, ...payload }).toString()}`, { cache: 'no-store' })
        : await fetch(API_BASE, { method, body: toParams({ action, token, scopeLabel, ...payload }) });
      const json = await response.json();

      if (!json.ok) {
        const error = new Error(json.error && json.error.message ? `Server mengatakan: ${json.error.message}` : 'Permintaan gagal.');
        error.code = json.error && json.error.code ? json.error.code : response.status;
        if (error.code === 401) {
          clearSession();
          window.location.replace('/pages/login/');
        }
        throw error;
      }
      return json.data;
    }

    function createNotice(text, type = 'info') {
      const element = document.createElement('div');
      element.className = `notice show ${type || 'info'}`;
      element.dataset.noticeId = `notice-${Date.now()}-${noticeCounter += 1}`;
      element.textContent = text;
      return element;
    }

    function relocateNoticeStack() {
      const stack = document.getElementById('noticeStack');
      const dialog = document.getElementById('attendanceDialog');
      if (dialog && dialog.open) {
        if (stack.parentNode !== dialog) dialog.appendChild(stack);
      } else if (stack.parentNode !== document.body) {
        document.body.prepend(stack);
      }
    }

    function showNotice(text, type) {
      if (noticeId) {
        const existing = document.querySelector(`[data-notice-id="${noticeId}"]`);
        if (existing) existing.remove();
      }
      const element = createNotice(text, type);
      const stack = document.getElementById('noticeStack');
      if (!stack) return;

      // Dialog absensi dibuka lewat showModal(), yang membuat semua elemen di luar dialog
      // jadi inert (tidak menerima klik) -- termasuk #noticeStack yang normalnya anak <body>.
      // Pindahkan sementara jadi anak dialog supaya notice tetap bisa di-dismiss selagi
      // dialog terbuka; dipindah balik ke <body> saat dialog ditutup (lihat listener 'close').
      relocateNoticeStack();

      function dismiss() {
        if (!element.parentNode) return;
        element.remove();
        if (!stack.hasChildNodes() && stack.matches(':popover-open')) {
          stack.hidePopover();
        }
      }

      element.addEventListener('click', dismiss);
      window.setTimeout(dismiss, type === 'error' ? 10000 : 6000);
      stack.prepend(element);
      noticeId = element.dataset.noticeId;
      if (stack.matches(':popover-open')) stack.hidePopover();
      stack.showPopover();
    }

    function mountShell(session) {
      return window.PSShell.mount({
        currentPage: window.PSAccess ? window.PSAccess.cleanFileName(window.location.pathname) : '/pages/kelasAbsensi/',
        session,
        getStoredSession,
        storageKey: STORAGE.session
      });
    }

    function getTodayAttendanceNotice(item) {
      const todayLabel = formatLongDate(state.today);
      const summary = item.todayRecord && item.todayRecord.summary ? item.todayRecord.summary : null;
      if (!summary || !summary.filled) {
        return {
          type: 'pending',
          text: `Kamu belum absensi hari ${todayLabel}.`
        };
      }
      if ((summary.filled || 0) >= (summary.total || 0)) {
        return {
          type: '',
          text: `Absensi hari ${todayLabel} sudah lengkap.`
        };
      }
      return {
        type: 'partial',
        text: `Absensi hari ${todayLabel} belum lengkap.`
      };
    }

    function getGuruText(item) {
      const guruNames = [...(item.pengajarLabels || []), ...(item.badalLabels || []).map(n => `${n} (badal)`)];
      return guruNames.length ? guruNames.join(', ') : 'Belum ada guru terpasang';
    }

    function getAuditSummaryHtml(item) {
      const audit = item.audit;
      if (!audit || !audit.active || !audit.missingCount) return '';
      const guruText = getGuruText(item);
      const hariText = audit.missingWeekdays && audit.missingWeekdays.length ? ` (${audit.missingWeekdays.join(', ')})` : '';

    function getGenderCardClass(value) {
      const text = String(value || '').toLowerCase().replace(/[_-]+/g, ' ').trim();
      if (['ikhwan', 'putra', 'l', 'lk', 'laki laki', 'laki', 'male'].includes(text)) return 'entity-gender-ikhwan';
      if (['akhowat', 'akhawat', 'akhwat', 'putri', 'p', 'pr', 'perempuan', 'female'].includes(text)) return 'entity-gender-akhowat';
      if (['campur', 'mixed', 'mix', 'gabungan'].includes(text)) return 'entity-gender-campur';
      return '';
    }

    function normalizeGenderKey(value) {
      const t = String(value || '').toLowerCase();
      if (['ikhwan', 'putra', 'laki-laki', 'laki', 'male', 'l'].some(k => t.includes(k))) return 'ikhwan';
      if (['akhowat', 'akhwat', 'putri', 'perempuan', 'female', 'p', 'wanita'].some(k => t.includes(k))) return 'akhowat';
      if (['campur', 'mixed', 'mix', 'gabungan'].some(k => t.includes(k))) return 'campur';
      return '';
    }

    function getFilteredItems() {
      const query = state.searchQuery.trim().toLowerCase();
      return state.items.filter(item => {
        if (state.filterGender && normalizeGenderKey(item.genderGroup) !== state.filterGender) return false;
        if (query) {
          const hay = [item.name, item.description, item.tahunAjaranNama, (item.pengajarLabels || []).join(' '), (item.badalLabels || []).join(' '), (item.santriLabels || []).join(' ')].join(' ').toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });
    }

    function buildPaginationList(page, totalPages) {
      const max = 10;
      if (totalPages <= max) return Array.from({ length: totalPages }, (_, i) => i + 1);
      const mid = max - 2;
      const pages = [1];
      let start = Math.max(2, page - Math.floor(mid / 2));
      let end = start + mid - 1;
      if (end > totalPages - 1) { end = totalPages - 1; start = end - mid + 1; }
      if (start > 2) pages.push('...');
      for (let i = start; i <= end; i++) pages.push(i);
      if (end < totalPages - 1) pages.push('...');
      pages.push(totalPages);
      return pages;
    }

    function renderPagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
      const markup = total > 0 ? `
        <div class="paging">
          <button class="secondary" type="button" data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}>Sebelumnya</button>
          <div class="page-center">
            <div class="page-numbers">
              ${buildPaginationList(state.page, totalPages).map(item =>
                item === '...'
                  ? '<span class="page-summary">...</span>'
                  : `<button class="secondary page-btn ${item === state.page ? 'active' : ''}" type="button" data-page="${item}">${item}</button>`
              ).join('')}
            </div>
            <div class="page-summary">Halaman ${state.page} dari ${totalPages} | total ${total} kelas</div>
          </div>
          <button class="secondary" type="button" data-page="${state.page + 1}" ${state.page >= totalPages ? 'disabled' : ''}>Berikutnya</button>
        </div>` : '';
      window.PSUI.syncPaginationHosts({ markup, visibleCount: Math.min(state.pageSize, total), totalCount: total, minimumCount: 0, topId: 'paginationTop', bottomId: 'paginationBottom' });
    }

    function clearModalClickTimers() {
      Object.keys(state.modal.clickTimers).forEach(key => {

      });
      state.modal.clickTimers = {};
      if (state.modal.longPressTimer) {

    }

    function resetModalState() {
      clearModalClickTimers();
      state.modal.open = false;
      state.modal.loading = false;
      state.modal.dirty = false;
      state.modal.filter = '';
      state.modal.kelas = null;

      state.modal.windowEndDate = '';
      state.modal.windowSize = 10;

    function promptSavePendingChanges() {
      if (pendingUnsavedPrompt) return pendingUnsavedPrompt;

      const overlay = document.getElementById('unsavedConfirm');
      const saveButton = document.getElementById('unsavedSaveButton');
      const stayButton = document.getElementById('unsavedStayButton');
      const cancelButton = document.getElementById('unsavedCancelButton');
      overlay.hidden = false;
      requestAnimationFrame(() => overlay.classList.add('show'));

      pendingUnsavedPrompt = new Promise(resolve => {
        const finish = value => {
          overlay.classList.remove('show');
          overlay.hidden = true;
          saveButton.removeEventListener('click', saveHandler);
          stayButton.removeEventListener('click', stayHandler);
          cancelButton.removeEventListener('click', cancelHandler);
          overlay.removeEventListener('click', backdropHandler);
          document.removeEventListener('keydown', keyHandler);
          pendingUnsavedPrompt = null;
          resolve(value);
        };
        const saveHandler = () => finish('save');
        const stayHandler = () => finish('stay');
        const cancelHandler = () => finish('discard');
        const backdropHandler = event => {
          if (event.target === overlay) finish('stay');
        };
        const keyHandler = event => {
          if (event.key === 'Escape') finish('stay');
        };

        saveButton.addEventListener('click', saveHandler);
        stayButton.addEventListener('click', stayHandler);
        cancelButton.addEventListener('click', cancelHandler);
        overlay.addEventListener('click', backdropHandler);
        document.addEventListener('keydown', keyHandler);
        setTimeout(() => saveButton.focus(), 0);
      });

      return pendingUnsavedPrompt;
    }

    async function confirmSavePendingChanges() {
      if (!state.modal.dirty) return true;
      const decision = await promptSavePendingChanges();
      if (decision === 'save') {
        return saveModalChanges({ reload: false });
      }
      if (decision === 'discard') {
        return true;
      }
      return false;
    }

    function syncDirtyPill() {
      const pill = document.getElementById('dirtyPill');
      const dirtyCount = state.modal.dirtyDates.length;
      pill.hidden = !state.modal.dirty;
      pill.textContent = dirtyCount > 1 ? `${dirtyCount} hari berubah` : dirtyCount === 1 ? '1 hari berubah' : '';
    }

    function getModalRecordByDate(dateValue) {
      return dateValue ? (state.modal.recordsByDate[dateValue] || null) : null;
    }

    function syncSelectedModalRecord() {
      if (!state.modal.selectedDate || !getModalRecordByDate(state.modal.selectedDate)) {
        state.modal.selectedDate = state.modal.windowDates[state.modal.windowDates.length - 1] || '';
      }
      state.modal.record = getModalRecordByDate(state.modal.selectedDate);
    }

    function buildComparableModalRecord(record) {
      return JSON.stringify({
        tanggal: record && record.tanggal ? record.tanggal : '',
        catatan: record && record.catatan ? record.catatan : '',
        entries: Array.isArray(record && record.entries) ? record.entries.map(entry => ({
          santriId: entry.santriId || '',
          status: entry.status || '',
          keterangan: entry.keterangan || ''
        })) : []
      });
    }

    function createModalSnapshot() {
      return {
        selectedDate: state.modal.selectedDate || '',
        bulkSetIndex: normalizeBulkSetIndex(state.modal.bulkSetIndex),
        windowDates: state.modal.windowDates.slice(),
        recordsByDate: clonePlain(state.modal.recordsByDate || {})
      };
    }

    function pushModalHistoryEntry(stack, snapshot) {
      stack.push(snapshot);
      if (stack.length > MODAL_HISTORY_LIMIT) {
        stack.shift();
      }
    }

    function restoreModalSnapshot(snapshot) {
      if (!snapshot) return;
      state.modal.selectedDate = snapshot.selectedDate || '';
      state.modal.bulkSetIndex = normalizeBulkSetIndex(snapshot.bulkSetIndex);
      state.modal.windowDates = Array.isArray(snapshot.windowDates) ? snapshot.windowDates.slice() : [];
      state.modal.recordsByDate = clonePlain(snapshot.recordsByDate || {});
      state.modal.windowDates.forEach(dateValue => {
        recalculateRecordSummary(state.modal.recordsByDate[dateValue]);
      });
      syncSelectedModalRecord();
      refreshModalDirtyState();
      renderDialog();
    }

    function commitModalMutation(mutator) {
      const previousSnapshot = createModalSnapshot();
      const mutation = mutator();
      const changed = typeof mutation === 'object' && mutation !== null ? !!mutation.changed : !!mutation;
      if (!changed) return false;
      pushModalHistoryEntry(state.modal.undoStack, previousSnapshot);
      state.modal.redoStack = [];
      refreshModalDirtyState();
      renderDialog();
      if (mutation && typeof mutation === 'object' && mutation.noticeText) {
        showNotice(mutation.noticeText, mutation.noticeType);
      }
      return true;
    }

    function undoModalChange() {
      if (!state.modal.undoStack.length) return;
      const snapshot = state.modal.undoStack.pop();
      pushModalHistoryEntry(state.modal.redoStack, createModalSnapshot());
      restoreModalSnapshot(snapshot);
    }

    function redoModalChange() {
      if (!state.modal.redoStack.length) return;
      const snapshot = state.modal.redoStack.pop();
      pushModalHistoryEntry(state.modal.undoStack, createModalSnapshot());
      restoreModalSnapshot(snapshot);
    }

    function refreshModalDirtyState() {
      state.modal.dirtyDates = state.modal.windowDates.filter(dateValue => {
        return buildComparableModalRecord(getModalRecordByDate(dateValue)) !== buildComparableModalRecord(state.modal.originalRecordsByDate[dateValue] || null);
      });
      markModalDirty(state.modal.dirtyDates.length > 0);
    }

    function recalculateRecordSummary(record) {
      if (!record || !Array.isArray(record.entries)) return;
      const summary = {
        total: record.entries.length,
        hadir: 0,
        izin: 0,
        sakit: 0,
        alfa: 0,
        tugas: 0,
        hari_tidak_aktif: 0,
        belum: 0,
        filled: 0,
        progressPercent: 0
      };

      record.entries.forEach(entry => {
        if (getStatusMeta(entry.status)) {
          summary[entry.status] += 1;
          summary.filled += 1;
        } else {
          summary.belum += 1;
        }
      });
      summary.progressPercent = summary.total ? Math.round((summary.filled / summary.total) * 100) : 0;
      record.summary = summary;
    }

    function applyModalWindow(data, options = {}) {
      const records = Array.isArray(data.window && data.window.dates) && data.window.dates.length
        ? data.window.dates
        : (data.record ? [data.record] : []);

      state.modal.recordsByDate = {};
      state.modal.originalRecordsByDate = {};
      state.modal.windowDates = [];

      records.forEach(sourceRecord => {
        if (!sourceRecord || !sourceRecord.tanggal) return;
        const record = clonePlain(sourceRecord);
        recalculateRecordSummary(record);
        state.modal.recordsByDate[record.tanggal] = record;
        state.modal.originalRecordsByDate[record.tanggal] = clonePlain(record);
        state.modal.windowDates.push(record.tanggal);
      });

      state.modal.windowEndDate = (data.window && data.window.endDate) || state.modal.windowDates[state.modal.windowDates.length - 1] || options.date || state.today;
      state.modal.windowSize = normalizeWindowSize((data.window && data.window.size) || options.windowSize || state.modal.windowSize);
      state.modal.selectedDate = options.selectedDate || (data.window && data.window.selectedDate) || (data.record && data.record.tanggal) || state.modal.windowEndDate;
      state.modal.bulkSetIndex = 0;
      state.modal.undoStack = [];
      state.modal.redoStack = [];
      syncSelectedModalRecord();
      state.modal.dirtyDates = [];
      markModalDirty(false);
    }

    // Urutan baris tabel HARUS stabil, tidak ikut tanggal yang sedang dipilih --
    // tiap tanggal punya array entries dengan urutan sendiri (backend nempel santri
    // "belum jadi anggota pada tanggal itu" di ujung array, beda-beda per tanggal), jadi
    // kalau row order ikut `state.modal.record` (tanggal terpilih), baris santri yang baru
    // pindah/gabung bisa lompat ke bawah saat kolom tanggal lamanya diklik. Dipakai tanggal
    // TERAKHIR di window (paling representatif utk keanggotaan saat ini) sebagai acuan urutan.
    function getReferenceModalRecord() {
      const dates = state.modal.windowDates;
      return getModalRecordByDate(dates[dates.length - 1]) || getModalRecordByDate(dates[0]) || null;
    }

    function getFilteredModalEntries() {
      const record = getReferenceModalRecord();
      if (!record || !Array.isArray(record.entries)) return [];
      const query = state.modal.filter.trim().toLowerCase();
      if (!query) return record.entries.slice();
      return record.entries.filter(entry => [entry.santriName, entry.noInduk].join(' ').toLowerCase().includes(query));
    }

    function matrixConditionInfos(entry, date) {
      if (!entry) return [];
      const infos = [];
      if (entry.sakit) {
        const isMulaiDay = entry.sakit.tanggalMulai && entry.sakit.tanggalMulai === date;
        const isSembuhDay = !entry.sakit.ongoing && entry.sakit.tanggalSembuh && entry.sakit.tanggalSembuh === date;
        if (isMulaiDay) {
          const boleh = sakitBolehLabel(entry);
          const label = 'Mulai Sakit' + (entry.sakit.jamMulai ? ' ' + entry.sakit.jamMulai : '') + (boleh ? ' — ' + boleh : '');
          const text = ['Mulai sakit' + (entry.sakit.jamMulai ? ' ' + entry.sakit.jamMulai : ''), entry.sakit.keterangan, entry.sakit.tempat ? 'di ' + entry.sakit.tempat : '', boleh].filter(Boolean).join(' · ');
          infos.push({ label, type: 'sakit', text });
        }
        if (isSembuhDay) {
          const label = 'Sembuh' + (entry.sakit.jamSembuh ? ' ' + entry.sakit.jamSembuh : '');
          const text = ['Sembuh' + (entry.sakit.jamSembuh ? ' ' + entry.sakit.jamSembuh : ''), entry.sakit.keterangan].filter(Boolean).join(' · ');
          infos.push({ label, type: 'sembuh', text });
        }
        if (!isMulaiDay && !isSembuhDay) {
          const boleh = sakitBolehLabel(entry);
          const label = 'Sakit' + (boleh ? ' — ' + boleh : '');
          const text = ['Sakit', entry.sakit.keterangan, entry.sakit.tempat ? 'di ' + entry.sakit.tempat : '', boleh].filter(Boolean).join(' · ');
          infos.push({ label, type: 'sakit', text });
        }
      }
      if (entry.izin) {
        const isBerangkatDay = entry.izin.tanggalIzin && entry.izin.tanggalIzin === date;
        const isKembaliDay = !entry.izin.ongoing && entry.izin.tanggalKembaliAktual && entry.izin.tanggalKembaliAktual === date;
        if (isBerangkatDay) {
          const label = 'Izin' + (entry.izin.jamIzin ? ' ' + entry.izin.jamIzin : '');
          const text = ['Berangkat izin' + (entry.izin.jamIzin ? ' ' + entry.izin.jamIzin : ''), entry.izin.keperluan].filter(Boolean).join(' · ');
          infos.push({ label, type: 'izin', text });
        }
        if (isKembaliDay) {
          const label = 'Kembali' + (entry.izin.jamKembaliAktual ? ' ' + entry.izin.jamKembaliAktual : '');
          const text = ['Sudah Kembali' + (entry.izin.jamKembaliAktual ? ' ' + entry.izin.jamKembaliAktual : ''), entry.izin.keperluan].filter(Boolean).join(' · ');
          infos.push({ label, type: 'kembali', text });
        }
        if (!isBerangkatDay && !isKembaliDay) {
          const text = ['Izin Pulang', entry.izin.keperluan].filter(Boolean).join(' · ');
          infos.push({ label: 'Izin', type: 'izin', text });
        }
      }
      return infos;
    }

    function sakitBolehLabel(entry) {
      if (!entry || !entry.sakit) return '';
      const map = { semua: 'Tetap wajib masuk kelas dan halaqoh', halaqoh: 'Boleh masuk halaqoh saja', kelas: 'Boleh masuk kelas saja', wajib_halaqoh: 'Wajib masuk halaqoh saja', wajib_kelas: 'Wajib masuk kelas saja', tidak: 'Tidak boleh masuk keduanya' };
      return map[entry.sakit.bolehMasuk || 'semua'] || map.semua;
    }
