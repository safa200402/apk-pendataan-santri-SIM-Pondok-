<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#9e2f22">
  <link rel="icon" href="/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="../../shared-ui.css">
  <link rel="stylesheet" href="../../shared-shell.css">
  <script src="../../shared-ui.js"></script>
  <title>Ganti Password</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .panel {
      padding: 22px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 10px;
    }

    p {
      margin: 0;
      line-height: 1.7;
    }

    .form-grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    button {
      font: inherit;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      outline: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      align-items: center;
      justify-content: flex-end;
    }

    button {
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      box-shadow: 0 14px 28px rgba(185, 118, 80, 0.22);
    }
  </style>
</head>
<body>
  <div class="notice-stack" id="noticeStack" popover="manual"></div>
  <main>
    <div class="app-layout">
      <section class="panel nav" id="nav"></section>
      <div class="content-stack">
        <section class="panel">
          <form id="passwordForm">
            <div class="form-grid">
              <h2>Ganti Password</h2>
              <label>
                Password lama
                <input id="currentPassword" type="password" autocomplete="current-password" required>
              </label>
              <label>
                Password baru
                <input id="newPassword" type="password" autocomplete="new-password" required>
              </label>
              <label>
                Konfirmasi password baru
                <input id="confirmPassword" type="password" autocomplete="new-password" required>
              </label>
            </div>
            <div class="toolbar">
              <button class="primary" id="saveButton" type="submit">Simpan password</button>
              <button class="secondary" type="reset">Kosongkan</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="../../shared-access.js"></script>
  <script src="../../shared-nav.js"></script>
  <script src="../../shared-shell.js"></script>
  <script>
    const API_BASE = window.location.origin + '/api';
    const STORAGE = { apiBase: 'ps_api_base', token: 'ps_token', session: 'ps_session' };
    localStorage.setItem(STORAGE.apiBase, API_BASE);

    function getApiBase() {
      return localStorage.getItem(STORAGE.apiBase) || '';
    }

    function getToken() {
      return localStorage.getItem(STORAGE.token) || '';
    }

    function clearSession() {
      localStorage.removeItem(STORAGE.token);
      localStorage.removeItem(STORAGE.session);
    }

    function getStoredSession() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE.session) || 'null');
      } catch (error) {
        return null;
      }
    }

    function toParams(data) {
      const params = new URLSearchParams();
      Object.entries(data).forEach(([key, value]) => {
        if (value === undefined || value === null) return;
        params.append(key, typeof value === 'object' ? JSON.stringify(value) : String(value));
      });
      return params;
    }

    function createNotice(text, type = 'info') {
      const element = document.createElement('section');
      element.className = `notice show ${type}`;
      element.textContent = text;
      const stack = document.getElementById('noticeStack');
      function dismiss() {
        if (!element.parentNode) return;
        element.classList.add('notice-dismissing');
        window.setTimeout(() => {
          element.remove();
          if (stack && !stack.hasChildNodes() && stack.matches(':popover-open')) stack.hidePopover();
        }, 220);
      }
      element.addEventListener('click', dismiss);
      window.setTimeout(dismiss, type === 'error' ? 10000 : 6000);
      stack.prepend(element);
      if (stack.matches(':popover-open')) stack.hidePopover();
      stack.showPopover();
    }

    async function api(action, payload = {}, method = 'POST') {
      const apiBase = getApiBase();
      const token = getToken();
      if (!apiBase || !token) {
        clearSession();
        window.location.replace('/pages/login/');
        throw new Error('Sesi tidak ditemukan.');
      }
      const response = await fetch(method === 'GET' ? `${apiBase}?${toParams({ action, token, ...payload }).toString()}` : apiBase, method === 'GET' ? undefined : {
        method,
        body: toParams({ action, token, ...payload })
      });
      const json = await response.json();
      if (!json.ok) {
        const error = new Error(json.error && json.error.message ? json.error.message : 'Permintaan gagal.');
        error.code = json.error && json.error.code ? json.error.code : response.status || 500;
        if (error.code === 401) {
          clearSession();
          window.location.replace('/pages/login/');
        }
        throw error;
      }
      return json.data;
    }

    async function savePassword(event) {
      event.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const button = document.getElementById('saveButton');

      if (!currentPassword || !newPassword || !confirmPassword) {
        createNotice('Semua field password wajib diisi.', 'error');
        return;
      }
      if (newPassword.length < 4) {
        createNotice('Password baru minimal 4 karakter.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        createNotice('Konfirmasi password baru tidak cocok.', 'error');
        return;
      }
      if (newPassword === currentPassword) {
        createNotice('Password baru harus berbeda dari password lama.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Menyimpan...';
      try {
        const data = await api('account.changePassword', {
          currentPassword,
          newPassword,
          confirmPassword
        }, 'POST');
        document.getElementById('passwordForm').reset();
        createNotice(data && data.message ? data.message : 'Password berhasil diperbarui.', 'success');
      } catch (error) {
        createNotice(error.message || 'Gagal mengganti password.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Simpan password';
      }
    }

    const currentPage = window.PSAccess ? window.PSAccess.cleanFileName(window.location.pathname) : '/pages/changePassword/';
    const session = getStoredSession();
    if (!session) {
      clearSession();
      window.location.replace('/pages/login/');
    }
    if (!(window.PSAccess && window.PSAccess.redirectIfForbidden(session, currentPage))) {
      window.PSShell.mount({
        currentPage,
        session,
        getStoredSession,
        storageKey: STORAGE.session
      });
      document.getElementById('passwordForm').addEventListener('submit', savePassword);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
    }
  </script>
</body>
</html>
